<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業スコアダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f4f0}
.wrap{max-width:780px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:20px;font-weight:500;margin-bottom:.25rem}
.subtitle{font-size:13px;color:#888;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid #ddd}
.tab-row{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid #e0e0e0}
.tab{padding:10px 20px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#534AB7;border-bottom:2px solid #534AB7;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem}
.metric{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:1rem}
.metric-label{font-size:12px;color:#888;margin-bottom:4px}
.metric-value{font-size:22px;font-weight:500;color:#1a1a1a}
.metric-sub{font-size:11px;color:#aaa;margin-top:2px}
.section-title{font-size:12px;font-weight:500;color:#888;margin-bottom:.75rem}
.student-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:1.5rem}
.student-card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem;cursor:pointer}
.student-card:hover{border-color:#AFA9EC}
.s-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#3C3489;flex-shrink:0}
.s-name{font-size:14px;font-weight:500;color:#1a1a1a}
.s-grade{font-size:11px;color:#888}
.score-row{display:flex;justify-content:space-between;align-items:flex-end}
.score-total{font-size:22px;font-weight:500;color:#534AB7}
.score-unit{font-size:12px;color:#888;margin-left:2px}
.score-count{font-size:11px;color:#aaa}
.bar-wrap{margin-top:8px;height:5px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:#7F77DD}
.detail-section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #eee}
.avatar-lg{width:48px;height:48px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#3C3489;flex-shrink:0}
.detail-name{font-size:16px;font-weight:500;color:#1a1a1a}
.detail-meta{font-size:12px;color:#888;margin-top:2px}
.lesson-list{display:flex;flex-direction:column;gap:6px}
.lesson-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;background:#f9f9f9;border-radius:8px}
.lesson-date{color:#888;width:88px;flex-shrink:0;font-size:12px}
.lesson-subject{color:#1a1a1a;flex:1}
.lesson-score{font-weight:500;color:#534AB7;width:48px;text-align:right;flex-shrink:0}
.chart-wrap{position:relative;width:100%;height:220px;margin-top:.5rem}
.loading{text-align:center;padding:3rem;color:#aaa;font-size:13px}
.empty{text-align:center;padding:2rem;color:#aaa;font-size:13px;background:#fff;border:1px solid #e0e0e0;border-radius:12px}
select{height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit}
.student-picker{width:100%;margin-bottom:1.25rem}
.roulette-section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem;margin-bottom:1rem;text-align:center}
.roulette-badge{display:inline-block;background:#EEEDFE;color:#3C3489;font-size:18px;font-weight:500;padding:4px 12px;border-radius:20px;margin-bottom:1rem}
.roulette-area{position:relative;margin:0 auto 1.25rem;width:280px;height:280px}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid #534AB7;z-index:10}
.roulette-result-box{background:#f9f9f9;border-radius:10px;padding:1rem;margin-bottom:1rem;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rresult-idle{font-size:13px;color:#aaa}
.rresult-rank{font-size:11px;padding:2px 10px;border-radius:20px;display:none}
.rresult-prize{font-size:18px;font-weight:500;color:#1a1a1a;display:none}
.rresult-congrats{font-size:12px;color:#888;display:none}
.btn-roulette{width:100%;padding:13px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-roulette:hover{background:#7F77DD}
.btn-roulette:disabled{background:#ccc;cursor:not-allowed}
.roulette-notice{font-size:12px;color:#aaa;margin-top:.75rem}
.roulette-already{font-size:13px;color:#888;padding:1rem;background:#f9f9f9;border-radius:10px;margin-bottom:1rem}
.score-progress-wrap{margin:1rem 0}
.score-progress-bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin-top:6px;border:1px solid #e0e0e0}
.score-progress-fill{height:100%;border-radius:4px;background:#7F77DD}
.score-progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>授業スコアダッシュボード</h1>
  <div class="subtitle">
    <select id="kyoshitsuSelect" onchange="loadData()" style="width:auto;display:inline-block">
      <option value="">全教室</option>
      <option value="安茂里駅前">安茂里駅前</option>
      <option value="屋代">屋代</option>
      <option value="長野青木島">長野青木島</option>
    </select>
    <span id="lastUpdate" style="margin-left:12px;font-size:12px;color:#aaa"></span>
  </div>
  <div class="tab-row" id="tabRow">
    <button class="tab active" id="tabAll" onclick="switchTab('all')">全生徒一覧</button>
    <button class="tab" id="tabDetail" onclick="switchTab('detail')">生徒別詳細</button>
  </div>
  <div id="viewAll">
    <div id="loadingAll" class="loading">読み込み中...</div>
    <div id="contentAll" style="display:none">
      <div class="metrics" id="metricsRow"></div>
      <div class="section-title" id="listTitle">生徒別 累計スコア（カードをタップで詳細表示）</div>
      <div class="student-grid" id="studentGrid"></div>
    </div>
  </div>
  <div id="viewDetail" style="display:none">
    <select class="student-picker" id="studentPicker" onchange="showDetail(this.value)">
      <option value="">-- 生徒を選択 --</option>
    </select>
    <div id="detailContent" style="display:none">
      <div class="roulette-section" id="rouletteSection" style="display:none">
        <div class="roulette-badge">🎡 ルーレットを引けます！</div>
        <div class="score-progress-wrap">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#888">
            <span>累計スコア</span><span id="rCurrentScore"></span>
          </div>
          <div class="score-progress-bar"><div class="score-progress-fill" id="rProgressFill"></div></div>
          <div class="score-progress-labels"><span>0</span><span>300点でルーレット1回</span></div>
        </div>
        <div class="roulette-area">
          <div class="pointer"></div>
          <canvas id="rouletteCanvas" width="280" height="280"></canvas>
        </div>
        <div class="roulette-result-box" id="rResultBox">
          <div class="rresult-idle" id="rResultIdle">ルーレットを回して景品を当てよう！</div>
          <div class="rresult-rank" id="rResultRank"></div>
          <div class="rresult-prize" id="rResultPrize"></div>
          <div class="rresult-congrats" id="rResultCongrats"></div>
        </div>
        <div id="rAlready" class="roulette-already" style="display:none"></div>
        <button class="btn-roulette" id="rouletteBtn" onclick="spinRoulette()">ルーレットを回す（300点消費）</button>
        <div class="roulette-notice" id="rouletteNotice">結果をスクショして塾に送ってね！</div>
      </div>
      <div class="detail-section">
        <div class="detail-head">
          <div class="avatar-lg" id="dAvatar"></div>
          <div>
            <div class="detail-name" id="dName"></div>
            <div class="detail-meta" id="dMeta"></div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:28px;font-weight:500;color:#534AB7" id="dTotal"></div>
            <div style="font-size:11px;color:#888">累計スコア</div>
          </div>
        </div>
        <div class="section-title">スコア推移</div>
        <div class="chart-wrap">
          <canvas id="scoreChart" role="img" aria-label="スコア推移グラフ">スコアの推移データ</canvas>
        </div>
      </div>
      <div class="detail-section">
        <div class="section-title" style="margin-bottom:.75rem">授業履歴</div>
        <div class="lesson-list" id="lessonList"></div>
      </div>
    </div>
    <div id="detailEmpty" class="empty">生徒を選択してください</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var WORKER_URL='https://notion-proxy.kobetsu-meiko.workers.dev';
var allRecords=[];
var studentMap={};
var chartInst=null;
var currentStudent=null;
var rWheelAngle=0;
var rSpinning=false;
var rCanvas=null;
var rCtx=null;
var ROULETTE_THRESHOLD=300;

// URLパラメータからスペースを除去して比較用キーを作る
var filterStudentName=new URLSearchParams(window.location.search).get('student')||'';
var filterStudentKey=filterStudentName.replace(/\s/g,'');

var PRIZES=[
  {name:'クオカード 10,000円',rank:'★★★ 激レア',rankBg:'#FAEEDA',rankColor:'#633806',color:'#EF9F27',prob:0.5},
  {name:'クオカード 5,000円',rank:'★★ レア',rankBg:'#FAEEDA',rankColor:'#633806',color:'#FAC775',prob:1},
  {name:'クオカード 1,000円',rank:'★ レア',rankBg:'#EEEDFE',rankColor:'#3C3489',color:'#AFA9EC',prob:20},
  {name:'文具プレゼント（上）',rank:'A ノーマル',rankBg:'#E1F5EE',rankColor:'#085041',color:'#5DCAA5',prob:15},
  {name:'文具プレゼント（中）',rank:'B ノーマル',rankBg:'#F1EFE8',rankColor:'#444441',color:'#B4B2A9',prob:25},
  {name:'文具プレゼント（下）',rank:'C ノーマル',rankBg:'#F1EFE8',rankColor:'#444441',color:'#D3D1C7',prob:38.5}
];

if(filterStudentKey){
  document.getElementById('tabRow').style.display='none';
  document.getElementById('kyoshitsuSelect').style.display='none';
  document.getElementById('listTitle').textContent='';
}

loadData();

function loadData(){
  var kyoshitsu=document.getElementById('kyoshitsuSelect').value;
  var url=WORKER_URL+'/get-scores'+(kyoshitsu?'?kyoshitsu='+encodeURIComponent(kyoshitsu):'');
  document.getElementById('loadingAll').style.display='block';
  document.getElementById('contentAll').style.display='none';
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      allRecords=data.records||[];
      buildStudentMap();
      renderAll();
      document.getElementById('lastUpdate').textContent='最終更新：'+new Date().toLocaleTimeString('ja-JP');
    })
    .catch(function(){
      document.getElementById('loadingAll').innerHTML='<span style="color:#c00">データの読み込みに失敗しました</span>';
    });
}

function buildStudentMap(){
  studentMap={};
  allRecords.forEach(function(rec){
    var key=rec.student;
    if(!studentMap[key]){studentMap[key]={name:rec.student,kyoshitsu:rec.kyoshitsu,records:[],usedScore:0};}
    studentMap[key].records.push(rec);
  });
  Object.values(studentMap).forEach(function(s){
    s.records.sort(function(a,b){return a.date.localeCompare(b.date);});
    s.rawTotal=s.records.reduce(function(sum,r){return sum+r.total;},0);
    s.count=s.records.length;
    // スペースなしのキーを追加
    s.nameKey=s.name.replace(/\s/g,'');
  });
}

function renderAll(){
  var students=Object.values(studentMap);

  if(filterStudentKey){
    // スペースを無視して比較
    students=students.filter(function(s){return s.nameKey===filterStudentKey;});
    document.getElementById('metricsRow').style.display='none';
  } else {
    var totalLessons=allRecords.length;
    var avgScore=students.length>0?Math.round(students.reduce(function(s,st){return s+st.rawTotal;},0)/students.length):0;
    var maxAll=students.length>0?Math.max.apply(null,students.map(function(s){return s.rawTotal;})):0;
    document.getElementById('metricsRow').innerHTML=
      '<div class="metric"><div class="metric-label">在籍生徒数</div><div class="metric-value">'+students.length+'</div><div class="metric-sub">名</div></div>'+
      '<div class="metric"><div class="metric-label">総授業回数</div><div class="metric-value">'+totalLessons+'</div><div class="metric-sub">回</div></div>'+
      '<div class="metric"><div class="metric-label">平均累計スコア</div><div class="metric-value">'+avgScore+'<span style="font-size:14px;font-weight:400">点</span></div><div class="metric-sub">最高 '+maxAll+'点</div></div>';
  }

  var maxScore=students.length>0?Math.max.apply(null,students.map(function(s){return s.rawTotal;})):1;
  var grid=document.getElementById('studentGrid');
  grid.innerHTML='';
  var picker=document.getElementById('studentPicker');
  picker.innerHTML='<option value="">-- 生徒を選択 --</option>';

  students.sort(function(a,b){return b.rawTotal-a.rawTotal;});
  students.forEach(function(s){
    var pct=Math.round(s.rawTotal/maxScore*100);
    var card=document.createElement('div');
    card.className='student-card';
    card.innerHTML=
      '<div class="s-head"><div class="avatar">'+s.name.slice(0,2)+'</div>'+
      '<div><div class="s-name">'+s.name+'</div><div class="s-grade">'+s.kyoshitsu+' ／ '+s.count+'回</div></div></div>'+
      '<div class="score-row"><div><span class="score-total">'+s.rawTotal+'</span><span class="score-unit">点</span></div>'+
      '<div class="score-count">'+s.count+'回分</div></div>'+
      '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div>';
    card.onclick=function(){
      document.querySelectorAll('.student-card').forEach(function(c){c.classList.remove('selected');});
      card.classList.add('selected');
      switchTab('detail');
      document.getElementById('studentPicker').value=s.name;
      showDetail(s.name);
    };
    grid.appendChild(card);
    var opt=document.createElement('option');
    opt.value=s.name;opt.textContent=s.name+'（'+s.count+'回・'+s.rawTotal+'点）';
    picker.appendChild(opt);
  });

  document.getElementById('loadingAll').style.display='none';
  document.getElementById('contentAll').style.display='block';
}

function showDetail(name){
  if(!name){
    document.getElementById('detailContent').style.display='none';
    document.getElementById('detailEmpty').style.display='block';
    return;
  }
  var s=studentMap[name];
  if(!s)return;
  currentStudent=s;
  document.getElementById('detailEmpty').style.display='none';
  document.getElementById('dAvatar').textContent=s.name.slice(0,2);
  document.getElementById('dName').textContent=s.name;
  document.getElementById('dMeta').textContent=s.kyoshitsu+' ／ 授業'+s.count+'回 ／ 累計'+s.rawTotal+'点';
  document.getElementById('dTotal').textContent=s.rawTotal;

  var cumulative=[],sum=0;
  var labels=s.records.map(function(r){sum+=r.total;cumulative.push(sum);return r.date.slice(5).replace('-','/');});
  var perScores=s.records.map(function(r){return r.total;});
  if(chartInst)chartInst.destroy();
  chartInst=new Chart(document.getElementById('scoreChart'),{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'累計スコア',data:cumulative,borderColor:'#534AB7',backgroundColor:'rgba(127,119,221,0.08)',tension:.3,pointRadius:4,pointBackgroundColor:'#534AB7',fill:true,yAxisID:'y'},
      {label:'各回スコア',data:perScores,borderColor:'#1D9E75',backgroundColor:'transparent',tension:.3,pointRadius:3,pointBackgroundColor:'#1D9E75',borderDash:[4,3],yAxisID:'y2'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{position:'left',ticks:{font:{size:11}},grid:{color:'rgba(0,0,0,0.05)'}},y2:{position:'right',ticks:{font:{size:11}},grid:{display:false}}}}
  });

  var list=document.getElementById('lessonList');
  list.innerHTML='';
  s.records.slice().reverse().slice(0,10).forEach(function(rec){
    var row=document.createElement('div');
    row.className='lesson-row';
    row.innerHTML='<span class="lesson-date">'+rec.date.slice(5).replace('-','/')+'</span><span class="lesson-subject">'+rec.subject+'</span><span class="lesson-score">+'+rec.total+'点</span>';
    list.appendChild(row);
  });

  document.getElementById('detailContent').style.display='block';
  setupRoulette(s);
}

function setupRoulette(s){
  var sec=document.getElementById('rouletteSection');
  var available=s.rawTotal-(s.usedScore||0);
  document.getElementById('rCurrentScore').textContent=available+'点';
  document.getElementById('rProgressFill').style.width=Math.min(100,Math.round(available/ROULETTE_THRESHOLD*100))+'%';
  if(available<ROULETTE_THRESHOLD){sec.style.display='none';return;}
  sec.style.display='block';
  rCanvas=document.getElementById('rouletteCanvas');
  rCtx=rCanvas.getContext('2d');
  rSpinning=false;rWheelAngle=0;
  drawRoulette(0);
  document.getElementById('rResultIdle').style.display='block';
  document.getElementById('rResultRank').style.display='none';
  document.getElementById('rResultPrize').style.display='none';
  document.getElementById('rResultCongrats').style.display='none';
  document.getElementById('rResultBox').style.display='flex';
  document.getElementById('rAlready').style.display='none';
  document.getElementById('rouletteBtn').disabled=false;
  document.getElementById('rouletteBtn').textContent='ルーレットを回す（300点消費）';
  document.getElementById('rouletteNotice').textContent='結果をスクショして塾に送ってね！';
  var scoreLevel=Math.floor(available/ROULETTE_THRESHOLD);
  fetch(WORKER_URL+'/get-roulette?student='+encodeURIComponent(s.name)+'&scoreLevel='+scoreLevel)
    .then(function(r){return r.json();})
    .then(function(data){if(data.result)showRouletteAlready(data.result);})
    .catch(function(){});
}

function drawRoulette(angle){
  var n=PRIZES.length,sliceAngle=2*Math.PI/n,cx=140,cy=140,r=135;
  rCtx.clearRect(0,0,280,280);
  for(var i=0;i<n;i++){
    var start=angle+i*sliceAngle,end=start+sliceAngle;
    rCtx.beginPath();rCtx.moveTo(cx,cy);rCtx.arc(cx,cy,r,start,end);rCtx.closePath();
    rCtx.fillStyle=PRIZES[i].color;rCtx.fill();rCtx.strokeStyle='#fff';rCtx.lineWidth=2;rCtx.stroke();
    rCtx.save();rCtx.translate(cx,cy);rCtx.rotate(start+sliceAngle/2);rCtx.textAlign='right';
    rCtx.fillStyle='#1a1a1a';rCtx.font='500 10px Hiragino Sans,sans-serif';
    var parts=PRIZES[i].name.split(' ');
    if(parts.length===1){rCtx.fillText(PRIZES[i].name,r-6,4);}
    else{rCtx.fillText(parts[0],r-6,-3);rCtx.fillText(parts[1],r-6,10);}
    rCtx.restore();
  }
  rCtx.beginPath();rCtx.arc(cx,cy,16,0,2*Math.PI);rCtx.fillStyle='#fff';rCtx.fill();
  rCtx.strokeStyle='#534AB7';rCtx.lineWidth=2;rCtx.stroke();
}

function getPrizeIdx(){
  var roll=Math.random()*100,cum=0;
  for(var i=0;i<PRIZES.length;i++){cum+=PRIZES[i].prob;if(roll<cum)return i;}
  return PRIZES.length-1;
}

function spinRoulette(){
  if(rSpinning||!currentStudent)return;
  rSpinning=true;
  document.getElementById('rouletteBtn').disabled=true;
  document.getElementById('rouletteBtn').textContent='回転中...';
  document.getElementById('rResultIdle').textContent='ドキドキ...';
  var prizeIdx=getPrizeIdx();
  var n=PRIZES.length,sliceAngle=2*Math.PI/n;
  var targetCenter=-Math.PI/2-(prizeIdx*sliceAngle+sliceAngle/2);
  var diff=targetCenter-rWheelAngle;
  diff=diff%(2*Math.PI);if(diff>0)diff-=2*Math.PI;
  var totalRotation=diff-5*2*Math.PI;
  var startAngle=rWheelAngle,start=null,duration=4500;
  function animate(ts){
    if(!start)start=ts;
    var elapsed=ts-start,progress=Math.min(elapsed/duration,1);
    var ease=1-Math.pow(1-progress,4);
    drawRoulette(startAngle+totalRotation*ease);
    if(progress<1){requestAnimationFrame(animate);}
    else{rWheelAngle=startAngle+totalRotation;finishSpin(prizeIdx);}
  }
  requestAnimationFrame(animate);
}

function finishSpin(prizeIdx){
  var s=currentStudent,prize=PRIZES[prizeIdx];
  var available=s.rawTotal-(s.usedScore||0);
  var scoreLevel=Math.floor(available/ROULETTE_THRESHOLD);
  fetch(WORKER_URL+'/save-roulette',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({student:s.name,prizeIdx:prizeIdx,prizeName:prize.name,rank:prize.rank,scoreLevel:scoreLevel})}).catch(function(){});
  fetch(WORKER_URL+'/use-score',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({student:s.name,amount:ROULETTE_THRESHOLD})})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.usedScore!==undefined){
        s.usedScore=data.usedScore;
        var newAvailable=s.rawTotal-s.usedScore;
        document.getElementById('rCurrentScore').textContent=newAvailable+'点';
        document.getElementById('rProgressFill').style.width=Math.min(100,Math.round(newAvailable/ROULETTE_THRESHOLD*100))+'%';
      }
    }).catch(function(){});
  showRouletteResult(prize);
}

function showRouletteResult(prize){
  document.getElementById('rResultIdle').style.display='none';
  var rank=document.getElementById('rResultRank');
  rank.textContent=prize.rank;rank.style.background=prize.rankBg;rank.style.color=prize.rankColor;rank.style.display='inline-block';
  var pr=document.getElementById('rResultPrize');pr.textContent=prize.name;pr.style.display='block';
  var cg=document.getElementById('rResultCongrats');
  cg.textContent=prize.prob<=1?'すごい！超レアが出ました！おめでとう！':prize.prob<=20?'やったね！おめでとうございます！':'おめでとうございます！';
  cg.style.display='block';
  document.getElementById('rouletteBtn').textContent='結果をスクショして塾に送ってね！';
  document.getElementById('rouletteNotice').textContent='このスクショを塾のLINEに送ると景品と交換できます';
}

function showRouletteAlready(result){
  document.getElementById('rResultBox').style.display='none';
  document.getElementById('rAlready').style.display='block';
  document.getElementById('rAlready').textContent='前回の結果：'+result.prizeName+'\nすでにルーレットを引いています。';
  document.getElementById('rouletteBtn').disabled=true;
  document.getElementById('rouletteBtn').textContent='引き直しはできません';
}

function switchTab(name){
  document.getElementById('tabAll').classList.toggle('active',name==='all');
  document.getElementById('tabDetail').classList.toggle('active',name==='detail');
  document.getElementById('viewAll').style.display=name==='all'?'':'none';
  document.getElementById('viewDetail').style.display=name==='detail'?'':'none';
  if(name==='detail'&&document.getElementById('studentPicker').value===''){
    document.getElementById('detailEmpty').style.display='block';
    document.getElementById('detailContent').style.display='none';
  }
}
</script>
</body>
</html>
