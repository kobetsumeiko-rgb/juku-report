<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単元進捗 印刷ページ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:13px;color:#1a1a1a;background:#f5f4f0}
.screen-wrap{max-width:860px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:18px;font-weight:500;margin-bottom:1rem}
.ctrl-section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.ctrl-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.ctrl-row:last-child{margin-bottom:0}
.ctrl-col{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:#666}
select{height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit}
.btn-print{padding:10px 24px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-print:hover{background:#7F77DD}
.status{font-size:12px;color:#888;padding-top:4px}
/* 印刷紙面 */
.print-page{background:#fff;border:1px solid #ddd;border-radius:4px;padding:20mm 16mm;margin-bottom:24px;width:210mm;min-height:100mm}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #1a1a1a}
.page-header-left h2{font-size:16px;font-weight:700;margin-bottom:2px}
.page-header-left .meta{font-size:11px;color:#555}
.page-header-right{text-align:right;font-size:11px;color:#555}
.subject-block{margin-bottom:18px}
.subject-title{font-size:12px;font-weight:700;color:#fff;background:#534AB7;padding:3px 10px;border-radius:3px;margin-bottom:6px;display:inline-block}
.unit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.unit-cell{border:1px solid #e0e0e0;border-radius:3px;padding:4px 6px;font-size:10.5px;line-height:1.4;position:relative}
.unit-cell.done-ari{background:#EEEDFE;border-color:#AFA9EC}
.unit-cell.done-nashi{background:#E6F1FB;border-color:#85B7EB}
.unit-cell.not-done{background:#fff;color:#aaa}
.unit-name{font-size:10px;line-height:1.4;word-break:break-all}
.unit-meta{font-size:9px;color:#666;margin-top:2px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tag-ari{background:#3C3489;color:#fff;border-radius:2px;padding:0 4px;font-size:8.5px}
.tag-nashi{background:#185FA5;color:#fff;border-radius:2px;padding:0 4px;font-size:8.5px}
.rating-text{font-size:9px;color:#444}
.count-badge{font-size:9px;color:#888;border:1px solid #ddd;border-radius:2px;padding:0 3px}
.legend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#555}
.legend-box{width:12px;height:12px;border-radius:2px;border:1px solid #ccc;flex-shrink:0}
.summary-row{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.summary-item{font-size:11px;color:#555}
.summary-item b{color:#1a1a1a;font-size:13px}
/* 印刷時 */
@media print{
  body{background:#fff}
  .screen-wrap{padding:0}
  .ctrl-section,.no-print{display:none!important}
  .print-page{border:none;margin:0;padding:14mm 12mm;width:100%;page-break-after:always;page-break-inside:avoid}
  .print-page:last-child{page-break-after:auto}
  .unit-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:600px){.unit-grid{grid-template-columns:repeat(2,1fr)}.print-page{width:100%;padding:1rem}}
</style>
</head>
<body>
<div class="screen-wrap">

<div class="ctrl-section no-print">
  <h1>単元進捗　印刷ページ</h1>
  <div class="ctrl-row">
    <div class="ctrl-col">
      <label>教室</label>
      <select id="kyoshitsuSel" onchange="onKyoshitsuChange()">
        <option value="">-- 教室を選択 --</option>
        <option value="安茂里駅前">安茂里駅前</option>
        <option value="屋代">屋代</option>
        <option value="長野青木島">長野青木島</option>
      </select>
    </div>
    <div class="ctrl-col">
      <label>学年</label>
      <select id="gradeSel" onchange="onGradeChange()">
        <option value="">-- 学年を選択 --</option>
        <option value="小3">小3</option><option value="小4">小4</option>
        <option value="小5">小5</option><option value="小6">小6</option>
        <option value="中1">中1</option><option value="中2">中2</option>
        <option value="中3">中3</option>
        <option value="高1">高1</option><option value="高2">高2</option>
        <option value="高3">高3</option>
      </select>
    </div>
    <div class="ctrl-col">
      <label>生徒</label>
      <select id="studentSel" onchange="onStudentChange()">
        <option value="">-- 先に学年を選択 --</option>
      </select>
    </div>
    <div class="ctrl-col">
      <label>科目</label>
      <select id="subjectSel" onchange="onSubjectChange()">
        <option value="">全科目</option>
      </select>
    </div>
  </div>
  <div class="ctrl-row">
    <button class="btn-print" onclick="window.print()">🖨 印刷する</button>
    <span class="status" id="statusMsg">生徒と科目を選択してください</span>
  </div>
</div>

<div id="pagesArea"></div>
</div>

<script>
var WORKER_URL='https://notion-proxy.kobetsu-meiko.workers.dev';

// KVマスタから生徒・教室データを読み込み
(function(){
  fetch(WORKER_URL+'/get-master')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.students){STUDENTS_BY_KYOSHITSU=data.students;}
      if(data.kyoshitsu){
        var sel=document.getElementById('kyoshitsuSel');
        if(!sel)return;
        while(sel.options.length>1)sel.remove(1);
        data.kyoshitsu.forEach(function(k){
          var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);
        });
      }
    })
    .catch(function(){});
})();

// 科目→単元リスト取得
function getUnitList(grade, subject) {
  if (subject === '数学') {
    if (grade === '中1') return [{label:'中1',units:MATH_J1}];
    if (grade === '中2') return [{label:'中1',units:MATH_J1},{label:'中2',units:MATH_J2}];
    if (grade === '中3') return [{label:'中1',units:MATH_J1},{label:'中2',units:MATH_J2},{label:'中3',units:MATH_J3}];
  }
  if (subject === '英語') {
    if (grade === '中1') return [{label:'中1',units:ENG_J1}];
    if (grade === '中2') return [{label:'中1',units:ENG_J1},{label:'中2',units:ENG_J2}];
    if (grade === '中3') return [{label:'中1',units:ENG_J1},{label:'中2',units:ENG_J2},{label:'中3',units:ENG_J3},{label:'中学まとめ',units:ENG_MATOME}];
  }
  if (subject === '数学Ⅰ') return [{label:'数学Ⅰ',units:MATH1_UNITS}];
  if (subject === '数学A') return [{label:'数学A',units:MATHA_UNITS}];
  if (subject === '数学Ⅱ') return [{label:'数学Ⅱ',units:MATH2_UNITS}];
  if (subject === '数学B') return [{label:'数学B',units:MATHB_UNITS}];
  if (subject === '数学Ⅲ') return [{label:'数学Ⅲ',units:MATH3_UNITS}];
  if (subject === '数学C') return [{label:'数学C',units:MATHC_UNITS}];
  if (subject === '算数') {
    var key = grade==='小4'?'算数（小4）':grade==='小5'?'算数（小5）':'算数（小6）';
    return [{label:'算数',units:GENERIC_UNITS[key]||[]}];
  }
  if (subject === '国語') {
    var key2 = grade.indexOf('高')===0?'国語（高）':grade==='中3'?'国語（中3）':'国語（中）';
    return [{label:'国語',units:GENERIC_UNITS[key2]||[]}];
  }
  if (subject === '英語' && grade.indexOf('高')===0) return [{label:'英語（高）',units:GENERIC_UNITS['英語（高）']||[]}];
  var key3 = GENERIC_UNITS[subject] ? subject : null;
  if (key3) return [{label:subject,units:GENERIC_UNITS[key3]}];
  return [{label:subject,units:[]}];
}

// ===== UI操作 =====
function onKyoshitsuChange(){
  document.getElementById('gradeSel').value='';
  document.getElementById('studentSel').innerHTML='<option value="">-- 先に学年を選択 --</option>';
  document.getElementById('subjectSel').innerHTML='<option value="">全科目</option>';
  document.getElementById('pagesArea').innerHTML='';
}
function onGradeChange(){
  var k=document.getElementById('kyoshitsuSel').value;
  var g=document.getElementById('gradeSel').value;
  var ss=document.getElementById('studentSel');
  var subj=document.getElementById('subjectSel');
  ss.innerHTML='<option value="">-- 生徒を選択 --</option>';
  subj.innerHTML='<option value="">全科目</option>';
  document.getElementById('pagesArea').innerHTML='';
  if(!k||!g)return;
  (STUDENTS_BY_KYOSHITSU[k]||{})[g]||[];
  var students=((STUDENTS_BY_KYOSHITSU[k]||{})[g])||[];
  students.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o);});
  (SUBJECTS_BY_GRADE[g]||[]).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;subj.appendChild(o);});
}
function onStudentChange(){
  var g=document.getElementById('gradeSel').value;
  var s=document.getElementById('studentSel').value;
  var subj=document.getElementById('subjectSel').value;
  if(s) loadAndRender(s,g,subj);
}
function onSubjectChange(){
  var g=document.getElementById('gradeSel').value;
  var s=document.getElementById('studentSel').value;
  var subj=document.getElementById('subjectSel').value;
  if(s) loadAndRender(s,g,subj);
}

// ===== データ取得と描画 =====
function loadAndRender(student, grade, subjectFilter){
  var msg=document.getElementById('statusMsg');
  msg.textContent='データ取得中...';
  document.getElementById('pagesArea').innerHTML='';
  fetch(WORKER_URL+'/get-unit-history?student='+encodeURIComponent(student))
    .then(function(r){return r.json();})
    .then(function(data){
      msg.textContent='';
      renderPages(student, grade, subjectFilter, data.records||[]);
    })
    .catch(function(){
      msg.textContent='データ取得に失敗しました';
    });
}

function renderPages(student, grade, subjectFilter, records){
  // 単元履歴をインデックス化: unitName -> [{date,hasInstruction,rating,subject}]
  var histMap={};
  records.forEach(function(r){
    var key=r.subject+'__'+r.unitName;
    if(!histMap[key])histMap[key]=[];
    histMap[key].push(r);
  });
  // 日付順ソート（古い順）
  Object.keys(histMap).forEach(function(k){
    histMap[k].sort(function(a,b){return a.date.localeCompare(b.date);});
  });

  var subjects = subjectFilter
    ? [subjectFilter]
    : (SUBJECTS_BY_GRADE[grade]||[]);

  var area=document.getElementById('pagesArea');
  area.innerHTML='';

  var page=document.createElement('div');
  page.className='print-page';

  // ヘッダー
  var today=new Date();
  var dateStr=today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日';
  page.innerHTML=
    '<div class="page-header">'+
      '<div class="page-header-left">'+
        '<h2>'+student+'　単元進捗表</h2>'+
        '<div class="meta">学年：'+grade+'　／　科目：'+(subjectFilter||'全科目')+'</div>'+
      '</div>'+
      '<div class="page-header-right">明光義塾<br>出力日：'+dateStr+'</div>'+
    '</div>'+
    '<div class="legend">'+
      '<div class="legend-item"><div class="legend-box" style="background:#EEEDFE;border-color:#AFA9EC"></div>指導あり</div>'+
      '<div class="legend-item"><div class="legend-box" style="background:#E6F1FB;border-color:#85B7EB"></div>指導なし</div>'+
      '<div class="legend-item"><div class="legend-box" style="background:#fff;border-color:#ccc"></div>未実施</div>'+
    '</div>';

  // 科目ごとにブロック生成
  var totalDone=0, totalUnits=0;
  subjects.forEach(function(subject){
    var sections=getUnitList(grade,subject);
    sections.forEach(function(sec){
      if(!sec.units||sec.units.length===0) return;
      totalUnits+=sec.units.length;
      var block=document.createElement('div');
      block.className='subject-block';
      var titleLabel=sections.length>1?(subject+' / '+sec.label):subject;
      block.innerHTML='<div class="subject-title">'+titleLabel+'</div>';
      var grid=document.createElement('div');
      grid.className='unit-grid';
      sec.units.forEach(function(unitName){
        var key=subject+'__'+unitName;
        var hist=histMap[key]||[];
        var cell=document.createElement('div');
        cell.className='unit-cell';
        if(hist.length>0){
          totalDone++;
          var latest=hist[hist.length-1];
          cell.classList.add(latest.hasInstruction?'done-ari':'done-nashi');
          var tagHtml=latest.hasInstruction
            ?'<span class="tag-ari">指導あり</span>'
            :'<span class="tag-nashi">指導なし</span>';
          var ratingHtml=latest.rating?'<span class="rating-text">'+latest.rating+'</span>':'';
          var countHtml=hist.length>1?'<span class="count-badge">'+hist.length+'回</span>':'';
          cell.innerHTML=
            '<div class="unit-name">'+unitName+'</div>'+
            '<div class="unit-meta">'+tagHtml+ratingHtml+countHtml+'</div>';
        } else {
          cell.classList.add('not-done');
          cell.innerHTML='<div class="unit-name">'+unitName+'</div>';
        }
        grid.appendChild(cell);
      });
      block.appendChild(grid);
      page.appendChild(block);
    });
  });

  // サマリー
  var summaryEl=document.createElement('div');
  summaryEl.className='summary-row';
  summaryEl.style.cssText='margin-top:14px;padding-top:10px;border-top:1px solid #eee';
  var pct=totalUnits>0?Math.round(totalDone/totalUnits*100):0;
  summaryEl.innerHTML=
    '<div class="summary-item">全単元数：<b>'+totalUnits+'</b></div>'+
    '<div class="summary-item">実施済み：<b>'+totalDone+'</b></div>'+
    '<div class="summary-item">未実施：<b>'+(totalUnits-totalDone)+'</b></div>'+
    '<div class="summary-item">進捗率：<b>'+pct+'%</b></div>';
  page.appendChild(summaryEl);

  area.appendChild(page);
  document.getElementById('statusMsg').textContent=
    '✅ '+subjects.length+'科目　全'+totalUnits+'単元中　'+totalDone+'単元実施済み（'+pct+'%）';
}
</script>
