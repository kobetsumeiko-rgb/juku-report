<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 - 明光義塾</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f4f0}
.wrap{max-width:860px;margin:0 auto;padding:1rem 1rem 4rem}
h1{font-size:18px;font-weight:500;margin-bottom:.25rem}
.subtitle{font-size:12px;color:#888;margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px}
.section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.section-title{font-size:14px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:12px;color:#666;margin-bottom:4px}
select,input[type=text],input[type=password]{width:100%;height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1a1a1a}
select:focus,input:focus{outline:none;border-color:#7F77DD}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}
.btn{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#534AB7;color:#fff}.btn-primary:hover{background:#7F77DD}
.btn-secondary{background:#f5f4f0;border:1px solid #ccc;color:#1a1a1a}.btn-secondary:hover{background:#eee}
.btn-danger{background:#FCEBEB;border:1px solid #F09595;color:#791F1F}.btn-danger:hover{background:#fde0e0}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.student-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.student-row{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:8px 12px}
.student-row-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.student-name{flex:1;font-size:13px;font-weight:500;min-width:80px}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.badge-grade{background:#EEEDFE;color:#3C3489}
.badge-ky{background:#E1F5EE;color:#085041}
.notion-ok{font-size:11px;color:#1D9E75}
.notion-ng{font-size:11px;color:#c00}
.edit-form{margin-top:10px;padding:12px;background:#EEEDFE;border-radius:8px;border:1px solid #AFA9EC;display:none}
.edit-form.open{display:block}
.edit-form-title{font-size:12px;font-weight:500;color:#3C3489;margin-bottom:10px}
.status-msg{font-size:12px;min-height:18px}
.status-ok{color:#1D9E75}.status-err{color:#c00}
.empty{text-align:center;padding:2rem;color:#aaa;font-size:13px}
.tab-row{display:flex;border-bottom:2px solid #e0e0e0;margin-bottom:1.25rem}
.tab{padding:8px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#534AB7;border-bottom-color:#534AB7;font-weight:500}
.view{display:none}.view.active{display:block}
.teacher-tag{display:inline-flex;align-items:center;gap:4px;background:#f5f4f0;border:1px solid #ddd;border-radius:6px;padding:3px 8px;font-size:12px;margin:3px}
.teacher-tag button{border:none;background:none;cursor:pointer;color:#aaa;font-size:16px;line-height:1;padding:0 2px}
.teacher-tag button:hover{color:#c00}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid #e0e0e0;border-radius:16px;padding:2.5rem 2rem;width:320px;text-align:center}
.login-title{font-size:18px;font-weight:500;margin-bottom:.5rem}
.login-sub{font-size:12px;color:#888;margin-bottom:1.5rem}
.login-input{width:100%;height:48px;font-size:18px;text-align:center;letter-spacing:.3em;border:1px solid #ccc;border-radius:8px;font-family:inherit;margin-bottom:1rem;background:#f9f9f9}
.login-input:focus{outline:none;border-color:#7F77DD;background:#fff}
.login-btn{width:100%;padding:12px;background:#534AB7;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.login-btn:hover{background:#7F77DD}
.login-err{font-size:12px;color:#c00;margin-top:8px;min-height:18px}
.tc-item{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.tc-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tc-name{font-size:13px;font-weight:500;flex:1}
.tc-ky{font-size:11px;padding:2px 7px;border-radius:4px;background:#EEEDFE;color:#3C3489}
.tc-date{font-size:11px;color:#888}
.tc-times{display:flex;gap:14px;font-size:12px;align-items:center;flex-wrap:wrap}
.tc-time-item{display:flex;align-items:center;gap:4px}
.tc-badge-in{color:#27500A;background:#EAF3DE;border:1px solid #C0DD97;border-radius:4px;padding:1px 6px;font-size:11px}
.tc-badge-out{color:#791F1F;background:#FCEBEB;border:1px solid #F09595;border-radius:4px;padding:1px 6px;font-size:11px}
.tc-badge-working{color:#085041;background:#E1F5EE;border:1px solid #5DCAA5;border-radius:4px;padding:1px 6px;font-size:11px}
.tc-dur{font-size:11px;color:#888;margin-left:auto}
.tc-edit-btn{font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid #ccc;background:#f5f4f0;color:#444;cursor:pointer;font-family:inherit;margin-left:auto;flex-shrink:0}
.tc-edit-btn:hover{background:#eee}
.transport-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #eee;font-size:13px}
.transport-row:last-child{border-bottom:none}
.transport-name{flex:1;font-weight:500}
.transport-ky{font-size:11px;padding:2px 7px;border-radius:4px;background:#E1F5EE;color:#085041;margin-right:4px}
.transport-amount{color:#534AB7;font-weight:500;min-width:70px;text-align:right}
.transport-del{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid #F09595;background:#FCEBEB;color:#791F1F;cursor:pointer;font-family:inherit}
.transport-del:hover{background:#fbd8d8}
.monthly-table{border-collapse:collapse;font-size:12px;min-width:600px}
.monthly-table th{padding:7px 10px;background:#f5f4f0;border:1px solid #ddd;white-space:nowrap;font-weight:500;color:#555;text-align:center}
.monthly-table th.teacher-col{text-align:left;min-width:90px}
.monthly-table td{padding:6px 10px;border:1px solid #eee;vertical-align:top;white-space:nowrap;text-align:center}
.monthly-table td.teacher-cell{text-align:left;font-weight:500;background:#fafafa;border:1px solid #ddd}
.monthly-table td.total-cell{background:#EEEDFE;font-weight:500;color:#3C3489;border:1px solid #ddd}
.monthly-table tr:hover td{background:#f9f8ff}
.monthly-table tr:hover td.teacher-cell{background:#f0effe}
.monthly-table tr:hover td.total-cell{background:#dddaf8}
.time-range{font-size:12px;color:#1a1a1a;line-height:1.4}
.time-dur{font-size:11px;color:#534AB7;margin-top:1px}
.no-record{color:#ccc;font-size:12px}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-title">管理画面</div>
    <div class="login-sub">明光義塾 スタッフ専用</div>
    <input class="login-input" type="password" id="adminPw" placeholder="パスワード" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
  <h1>管理画面</h1>
  <div class="subtitle">
    明光義塾 スタッフ専用
    <span id="saveStatus" style="color:#1D9E75;font-size:12px"></span>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tab-students" onclick="switchTab('students')">生徒管理</button>
    <button class="tab" id="tab-teachers" onclick="switchTab('teachers')">講師管理</button>
    <button class="tab" id="tab-kyoshitsu" onclick="switchTab('kyoshitsu')">教室管理</button>
    <button class="tab" id="tab-transport" onclick="switchTab('transport')">交通費</button>
    <button class="tab" id="tab-timecard" onclick="switchTab('timecard')">打刻履歴</button>
    <button class="tab" id="tab-monthly" onclick="switchTab('monthly')">月次集計</button>
  </div>

  <!-- 生徒管理 -->
  <div class="view active" id="view-students">
    <div class="section">
      <div class="section-title">新規生徒を追加</div>
      <div class="row3">
        <div>
          <label>教室</label>
          <select id="addKyoshitsu"><option value="">-- 選択 --</option></select>
        </div>
        <div>
          <label>学年</label>
          <select id="addGrade">
            <option value="">-- 選択 --</option>
            <option>小3</option><option>小4</option><option>小5</option><option>小6</option>
            <option>中1</option><option>中2</option><option>中3</option>
            <option>高1</option><option>高2</option><option>高3</option>
          </select>
        </div>
        <div>
          <label>生徒名</label>
          <input type="text" id="addName" placeholder="例：山田 太郎">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Notion ページ ID（任意）</label>
          <input type="text" id="addNotionId" placeholder="32桁のID">
        </div>
        <div>
          <label>保護者 PIN・4桁（任意）</label>
          <input type="text" id="addPin" placeholder="例：1234" maxlength="4">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="addStudent()">追加する</button>
        <span class="status-msg" id="addStudentMsg"></span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        生徒一覧
        <span id="studentCountBadge" style="font-size:12px;color:#888;font-weight:400"></span>
        <select id="filterKyoshitsu" onchange="renderStudentList()" style="width:auto;height:30px;font-size:12px;margin-left:auto">
          <option value="">全教室</option>
        </select>
        <select id="filterGrade" onchange="renderStudentList()" style="width:auto;height:30px;font-size:12px">
          <option value="">全学年</option>
          <option>小3</option><option>小4</option><option>小5</option><option>小6</option>
          <option>中1</option><option>中2</option><option>中3</option>
          <option>高1</option><option>高2</option><option>高3</option>
        </select>
      </div>
      <div id="studentListWrap"><div class="empty">読み込み中...</div></div>
    </div>
  </div>

  <!-- 講師管理 -->
  <div class="view" id="view-teachers">
    <div class="section">
      <div class="section-title">講師を追加</div>
      <div class="row">
        <div>
          <label>教室</label>
          <select id="teacherKyoshitsu"><option value="">-- 選択 --</option></select>
        </div>
        <div>
          <label>講師名</label>
          <input type="text" id="teacherName" placeholder="例：田中 太郎">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="addTeacher()">追加する</button>
        <span class="status-msg" id="addTeacherMsg"></span>
      </div>
    </div>
    <div class="section">
      <div class="section-title">講師一覧</div>
      <div id="teacherListWrap"><div class="empty">読み込み中...</div></div>
    </div>
  </div>

  <!-- 教室管理 -->
  <div class="view" id="view-kyoshitsu">
    <div class="section">
      <div class="section-title">教室を追加</div>
      <div class="row">
        <div>
          <label>教室名</label>
          <input type="text" id="newKyoshitsuName" placeholder="例：松本教室">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="addKyoshitsu()">追加する</button>
        <span class="status-msg" id="addKyoshitsuMsg"></span>
      </div>
    </div>
    <div class="section">
      <div class="section-title">教室一覧</div>
      <div id="kyoshitsuListWrap"><div class="empty">読み込み中...</div></div>
    </div>
  </div>

  <!-- 交通費管理 -->
  <div class="view" id="view-transport">
    <div class="section">
      <div class="section-title">交通費を登録・更新</div>
      <p style="font-size:12px;color:#888;margin-bottom:1rem;line-height:1.7">講師ごとの月次交通費を登録します。給与計算時にここの値が使用されます。</p>
      <div class="row">
        <div>
          <label>教室</label>
          <select id="transportKyoshitsu" onchange="onTransportKyoshitsuChange()">
            <option value="">-- 選択 --</option>
          </select>
        </div>
        <div>
          <label>講師名</label>
          <select id="transportTeacher">
            <option value="">-- 先に教室を選択 --</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>交通費（円／月）</label>
          <input type="text" id="transportAmount" placeholder="例：3000" style="ime-mode:disabled">
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-primary" onclick="saveTransport()" style="width:100%">登録・更新する</button>
        </div>
      </div>
      <span class="status-msg" id="transportMsg"></span>
    </div>
    <div class="section">
      <div class="section-title">交通費一覧</div>
      <div id="transportListWrap"><div class="empty">読み込み中...</div></div>
    </div>
  </div>

  <!-- 打刻履歴管理 -->
  <div class="view" id="view-timecard">

    <!-- 打刻を新規追加 -->
    <div class="section">
      <div class="section-title">打刻を新規追加</div>
      <p style="font-size:12px;color:#888;margin-bottom:1rem;line-height:1.7">打刻し忘れた日など、記録がない日の出退勤を手動で追加できます。</p>
      <div class="row3">
        <div>
          <label>教室</label>
          <select id="tcAddKyoshitsu" onchange="onTcAddKyoshitsuChange()">
            <option value="">-- 選択 --</option>
          </select>
        </div>
        <div>
          <label>講師名</label>
          <select id="tcAddTeacher">
            <option value="">-- 先に教室を選択 --</option>
          </select>
        </div>
        <div>
          <label>日付</label>
          <input type="date" id="tcAddDate">
        </div>
      </div>
      <div class="row">
        <div>
          <label>出勤時刻</label>
          <input type="text" id="tcAddIn" placeholder="例：16:30">
        </div>
        <div>
          <label>退勤時刻（任意）</label>
          <input type="text" id="tcAddOut" placeholder="例：21:20">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="addTimecardManual()">追加する</button>
        <span class="status-msg" id="tcAddMsg"></span>
      </div>
    </div>

    <!-- 打刻履歴一覧 -->
    <div class="section">
      <div class="section-title">
        打刻履歴
        <select id="tcFilterKyoshitsu" onchange="loadTimecardHistory()" style="width:auto;height:30px;font-size:12px;margin-left:auto">
          <option value="">全教室</option>
        </select>
        <input type="date" id="tcFilterDate" onchange="loadTimecardHistory()" style="height:30px;padding:0 8px;border:1px solid #ccc;border-radius:6px;font-size:12px;font-family:inherit">
      </div>
      <div id="tcListWrap"><div class="empty">読み込み中...</div></div>
    </div>

    <!-- 打刻修正モーダル風パネル -->
    <div class="section" id="tcEditSection" style="display:none">
      <div class="section-title" id="tcEditTitle">打刻を修正</div>
      <div class="row">
        <div>
          <label>出勤時刻</label>
          <input type="text" id="tcEditIn" placeholder="例：16:30">
        </div>
        <div>
          <label>退勤時刻</label>
          <input type="text" id="tcEditOut" placeholder="例：21:20">
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="applyTimecardEdit()">修正を保存</button>
        <button class="btn btn-secondary" onclick="cancelTimecardEdit()">キャンセル</button>
        <span class="status-msg" id="tcEditMsg"></span>
      </div>
    </div>
  </div>

  <!-- 月次集計 -->
  <div class="view" id="view-monthly">
    <div class="section">
      <div class="section-title">集計条件</div>
      <div class="row">
        <div>
          <label>対象月</label>
          <input type="month" id="monthlyMonth" style="height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;width:100%">
        </div>
        <div>
          <label>教室</label>
          <select id="monthlyKyoshitsu">
            <option value="">-- 選択 --</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="loadMonthlySummary()">表示する</button>
        <span class="status-msg" id="monthlyMsg"></span>
      </div>
    </div>
    <div class="section" id="monthlySummarySection" style="display:none">
      <div class="section-title" id="monthlySummaryTitle"></div>
      <div style="overflow-x:auto">
        <div id="monthlySummaryWrap"></div>
      </div>
    </div>
  </div>
</div>

// ===== ログイン =====
function doLogin() {
  var pw = document.getElementById('adminPw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('loginErr').textContent = 'パスワードが違います';
    document.getElementById('adminPw').value = '';
  }
}

// ===== データ読み込み =====
function loadAll() {
  fetch(WORKER_URL + '/get-master')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      masterKyoshitsu = data.kyoshitsu || DEFAULT_KYOSHITSU;
      masterStudents = data.students || DEFAULT_STUDENTS;
      masterNotionPages = data.notionPages || DEFAULT_NOTION;
      masterPins = data.pins || {};
      masterTeachers = data.teachers || DEFAULT_TEACHERS;
      masterTransport = data.transport || {};
      if (!data.students) {
        // 初回：デフォルトデータをKVに保存
        saveMaster('students', masterStudents, function(){});
        saveMaster('notionPages', masterNotionPages, function(){});
        saveMaster('kyoshitsu', masterKyoshitsu, function(){});
        saveMaster('teachers', masterTeachers, function(){});
      }
      renderAll();
    })
    .catch(function() {
      masterKyoshitsu = DEFAULT_KYOSHITSU;
      masterStudents = DEFAULT_STUDENTS;
      masterNotionPages = DEFAULT_NOTION;
      masterTeachers = DEFAULT_TEACHERS;
      masterTransport = {};
      renderAll();
    });
}

function renderAll() {
  renderKyoshitsuSelects();
  renderStudentList();
  renderTeacherList();
  renderKyoshitsuList();
}

function renderKyoshitsuSelects() {
  ['addKyoshitsu', 'teacherKyoshitsu', 'filterKyoshitsu', 'transportKyoshitsu', 'tcFilterKyoshitsu', 'tcAddKyoshitsu', 'monthlyKyoshitsu'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var cur = el.value;
    var isFilter = (id === 'filterKyoshitsu' || id === 'tcFilterKyoshitsu');
    el.innerHTML = isFilter ? '<option value="">全教室</option>' : '<option value="">-- 選択 --</option>';
    masterKyoshitsu.forEach(function(k) {
      var o = document.createElement('option');
      o.value = k; o.textContent = k;
      el.appendChild(o);
    });
    if (cur) el.value = cur;
  });
}

// ===== 生徒一覧 =====
function renderStudentList() {
  var filterK = document.getElementById('filterKyoshitsu').value;
  var filterG = document.getElementById('filterGrade').value;
  var wrap = document.getElementById('studentListWrap');
  var rows = [];
  masterKyoshitsu.forEach(function(k) {
    if (filterK && k !== filterK) return;
    GRADES.forEach(function(g) {
      if (filterG && g !== filterG) return;
      ((masterStudents[k] || {})[g] || []).forEach(function(name) {
        rows.push({ kyoshitsu: k, grade: g, name: name });
      });
    });
  });
  document.getElementById('studentCountBadge').textContent = '計 ' + rows.length + ' 名';
  if (rows.length === 0) { wrap.innerHTML = '<div class="empty">生徒が登録されていません</div>'; return; }
  wrap.innerHTML = '';
  var list = document.createElement('div');
  list.className = 'student-list';
  rows.forEach(function(r) {
    var notionId = (masterNotionPages[r.kyoshitsu] || {})[r.name] || '';
    var notionOk = notionId && notionId !== 'ページIDをここに入力';
    var item = document.createElement('div');
    item.className = 'student-row';
    item.id = 'srow_' + r.kyoshitsu + '_' + r.grade + '_' + r.name;
    var inner = document.createElement('div');
    inner.className = 'student-row-inner';
    // 名前
    var nameEl = document.createElement('div');
    nameEl.className = 'student-name';
    nameEl.textContent = r.name;
    // 学年
    var gradeBadge = document.createElement('span');
    gradeBadge.className = 'badge badge-grade';
    gradeBadge.textContent = r.grade;
    // 教室
    var kyoBadge = document.createElement('span');
    kyoBadge.className = 'badge badge-ky';
    kyoBadge.textContent = r.kyoshitsu;
    // Notion状態
    var notionEl = document.createElement('span');
    notionEl.className = notionOk ? 'notion-ok' : 'notion-ng';
    notionEl.textContent = notionOk ? 'Notion✓' : 'Notion未設定';
    // 編集ボタン
    var editBtn = document.createElement('button');
    editBtn.className = 'btn btn-secondary btn-sm';
    editBtn.textContent = '編集';
    (function(k, g, n) {
      editBtn.onclick = function() { toggleEditForm(k, g, n); };
    })(r.kyoshitsu, r.grade, r.name);
    // 削除ボタン
    var delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger btn-sm';
    delBtn.textContent = '削除';
    (function(k, g, n) {
      delBtn.onclick = function() { deleteStudent(k, g, n); };
    })(r.kyoshitsu, r.grade, r.name);
    inner.appendChild(nameEl);
    inner.appendChild(gradeBadge);
    inner.appendChild(kyoBadge);
    inner.appendChild(notionEl);
    inner.appendChild(editBtn);
    inner.appendChild(delBtn);
    item.appendChild(inner);
    // 編集フォーム（非表示）
    var form = buildEditForm(r.kyoshitsu, r.grade, r.name);
    item.appendChild(form);
    list.appendChild(item);
  });
  wrap.appendChild(list);
}

function buildEditForm(k, g, name) {
  var notionId = (masterNotionPages[k] || {})[name] || '';
  var pin = masterPins[name] || '';
  var form = document.createElement('div');
  form.className = 'edit-form';
  form.id = 'ef_' + k + '_' + g + '_' + name;
  var title = document.createElement('div');
  title.className = 'edit-form-title';
  title.textContent = '✏️ ' + name + 'さんの情報を編集';
  var row = document.createElement('div');
  row.className = 'row';
  row.style.marginBottom = '10px';
  var col1 = document.createElement('div');
  var lbl1 = document.createElement('label');
  lbl1.textContent = 'Notion ページ ID';
  var inp1 = document.createElement('input');
  inp1.type = 'text';
  inp1.id = 'ef_notion_' + k + '_' + g + '_' + name;
  inp1.value = notionId;
  inp1.placeholder = '32桁のID';
  col1.appendChild(lbl1); col1.appendChild(inp1);
  var col2 = document.createElement('div');
  var lbl2 = document.createElement('label');
  lbl2.textContent = '保護者 PIN（4桁）';
  var inp2 = document.createElement('input');
  inp2.type = 'text';
  inp2.id = 'ef_pin_' + k + '_' + g + '_' + name;
  inp2.value = pin;
  inp2.placeholder = '例：1234';
  inp2.maxLength = 4;
  col2.appendChild(lbl2); col2.appendChild(inp2);
  row.appendChild(col1); row.appendChild(col2);
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;align-items:center';
  var saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary btn-sm';
  saveBtn.textContent = '保存する';
  (function(k2, g2, n2) {
    saveBtn.onclick = function() { saveEditStudent(k2, g2, n2); };
  })(k, g, name);
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-secondary btn-sm';
  cancelBtn.textContent = 'キャンセル';
  (function(k2, g2, n2) {
    cancelBtn.onclick = function() {
      document.getElementById('ef_' + k2 + '_' + g2 + '_' + n2).classList.remove('open');
    };
  })(k, g, name);
  var msg = document.createElement('span');
  msg.className = 'status-msg';
  msg.id = 'ef_msg_' + k + '_' + g + '_' + name;
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn); btnRow.appendChild(msg);
  form.appendChild(title); form.appendChild(row); form.appendChild(btnRow);
  return form;
}

function toggleEditForm(k, g, name) {
  // 他の編集フォームを閉じる
  document.querySelectorAll('.edit-form.open').forEach(function(f) {
    f.classList.remove('open');
  });
  var form = document.getElementById('ef_' + k + '_' + g + '_' + name);
  if (form) form.classList.add('open');
}

function saveEditStudent(k, g, name) {
  var newNotion = document.getElementById('ef_notion_' + k + '_' + g + '_' + name).value.trim();
  var newPin = document.getElementById('ef_pin_' + k + '_' + g + '_' + name).value.trim();
  var msg = document.getElementById('ef_msg_' + k + '_' + g + '_' + name);
  if (!masterNotionPages[k]) masterNotionPages[k] = {};
  if (newNotion) masterNotionPages[k][name] = newNotion;
  if (newPin) masterPins[name] = newPin;
  saveMaster('notionPages', masterNotionPages, function() {
    saveMaster('pins', masterPins, function() {
      if (newPin) {
        fetch(WORKER_URL + '/save-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student: name, pin: newPin })
        }).catch(function() {});
      }
      msg.textContent = '✅ 保存しました';
      msg.className = 'status-msg status-ok';
      setTimeout(function() {
        var form = document.getElementById('ef_' + k + '_' + g + '_' + name);
        if (form) form.classList.remove('open');
        renderStudentList();
      }, 1000);
    });
  });
}

// ===== 生徒追加 =====
function addStudent() {
  var k = document.getElementById('addKyoshitsu').value;
  var g = document.getElementById('addGrade').value;
  var name = document.getElementById('addName').value.trim();
  var notionId = document.getElementById('addNotionId').value.trim();
  var pin = document.getElementById('addPin').value.trim();
  var msg = document.getElementById('addStudentMsg');
  if (!k || !g || !name) {
    msg.textContent = '教室・学年・生徒名は必須です';
    msg.className = 'status-msg status-err'; return;
  }
  if (!masterStudents[k]) masterStudents[k] = {};
  if (!masterStudents[k][g]) masterStudents[k][g] = [];
  if (masterStudents[k][g].indexOf(name) >= 0) {
    msg.textContent = 'その生徒はすでに登録されています';
    msg.className = 'status-msg status-err'; return;
  }
  masterStudents[k][g].push(name);
  if (notionId) {
    if (!masterNotionPages[k]) masterNotionPages[k] = {};
    masterNotionPages[k][name] = notionId;
  }
  if (pin) masterPins[name] = pin;
  saveMaster('students', masterStudents, function() {
    saveMaster('notionPages', masterNotionPages, function() {
      saveMaster('pins', masterPins, function() {
        if (pin) {
          fetch(WORKER_URL + '/save-pin', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student: name, pin: pin })
          }).catch(function() {});
        }
        msg.textContent = '✅ ' + name + 'さんを追加しました';
        msg.className = 'status-msg status-ok';
        document.getElementById('addName').value = '';
        document.getElementById('addNotionId').value = '';
        document.getElementById('addPin').value = '';
        renderStudentList();
      });
    });
  });
}

// ===== 生徒削除 =====
function deleteStudent(k, g, name) {
  if (!confirm(name + 'さんを削除しますか？')) return;
  var arr = (masterStudents[k] || {})[g] || [];
  var idx = arr.indexOf(name);
  if (idx >= 0) arr.splice(idx, 1);
  saveMaster('students', masterStudents, function() {
    renderStudentList();
    showSaveStatus(name + 'さんを削除しました');
  });
}

// ===== 講師 =====
function renderTeacherList() {
  var wrap = document.getElementById('teacherListWrap');
  wrap.innerHTML = '';
  masterKyoshitsu.forEach(function(k) {
    var teachers = masterTeachers[k] || [];
    var block = document.createElement('div');
    block.style.marginBottom = '1rem';
    var ttl = document.createElement('div');
    ttl.style.cssText = 'font-size:13px;font-weight:500;color:#666;margin-bottom:6px';
    ttl.textContent = k;
    var tagWrap = document.createElement('div');
    if (teachers.length === 0) {
      tagWrap.innerHTML = '<span style="font-size:12px;color:#aaa">（登録なし）</span>';
    } else {
      teachers.forEach(function(t) {
        var tag = document.createElement('span');
        tag.className = 'teacher-tag';
        tag.textContent = t;
        var btn = document.createElement('button');
        btn.textContent = '×';
        (function(k2, t2) { btn.onclick = function() { deleteTeacher(k2, t2); }; })(k, t);
        tag.appendChild(btn);
        tagWrap.appendChild(tag);
      });
    }
    block.appendChild(ttl); block.appendChild(tagWrap);
    wrap.appendChild(block);
  });
}

function addTeacher() {
  var k = document.getElementById('teacherKyoshitsu').value;
  var name = document.getElementById('teacherName').value.trim();
  var msg = document.getElementById('addTeacherMsg');
  if (!k || !name) { msg.textContent = '教室と講師名は必須です'; msg.className = 'status-msg status-err'; return; }
  if (!masterTeachers[k]) masterTeachers[k] = [];
  if (masterTeachers[k].indexOf(name) >= 0) { msg.textContent = 'その講師はすでに登録されています'; msg.className = 'status-msg status-err'; return; }
  masterTeachers[k].push(name);
  saveMaster('teachers', masterTeachers, function() {
    msg.textContent = '✅ ' + name + 'を追加しました'; msg.className = 'status-msg status-ok';
    document.getElementById('teacherName').value = '';
    renderTeacherList();
  });
}

function deleteTeacher(k, name) {
  if (!confirm(name + 'を削除しますか？')) return;
  var arr = masterTeachers[k] || [];
  var idx = arr.indexOf(name);
  if (idx >= 0) arr.splice(idx, 1);
  saveMaster('teachers', masterTeachers, function() { renderTeacherList(); showSaveStatus(name + 'を削除しました'); });
}

// ===== 教室 =====
function renderKyoshitsuList() {
  var wrap = document.getElementById('kyoshitsuListWrap');
  if (masterKyoshitsu.length === 0) { wrap.innerHTML = '<div class="empty">教室が登録されていません</div>'; return; }
  wrap.innerHTML = '';
  var list = document.createElement('div');
  list.className = 'student-list';
  masterKyoshitsu.forEach(function(k) {
    var cnt = 0;
    GRADES.forEach(function(g) { cnt += ((masterStudents[k] || {})[g] || []).length; });
    var row = document.createElement('div');
    row.className = 'student-row';
    var inner = document.createElement('div');
    inner.className = 'student-row-inner';
    var nameEl = document.createElement('div'); nameEl.className = 'student-name'; nameEl.textContent = k;
    var badge = document.createElement('span'); badge.className = 'badge badge-ky'; badge.textContent = '生徒 ' + cnt + ' 名';
    var delBtn = document.createElement('button'); delBtn.className = 'btn btn-danger btn-sm'; delBtn.textContent = '削除';
    (function(k2) { delBtn.onclick = function() { deleteKyoshitsu(k2); }; })(k);
    inner.appendChild(nameEl); inner.appendChild(badge); inner.appendChild(delBtn);
    row.appendChild(inner); list.appendChild(row);
  });
  wrap.appendChild(list);
}

function addKyoshitsu() {
  var name = document.getElementById('newKyoshitsuName').value.trim();
  var msg = document.getElementById('addKyoshitsuMsg');
  if (!name) { msg.textContent = '教室名は必須です'; msg.className = 'status-msg status-err'; return; }
  if (masterKyoshitsu.indexOf(name) >= 0) { msg.textContent = 'その教室はすでに登録されています'; msg.className = 'status-msg status-err'; return; }
  masterKyoshitsu.push(name);
  saveMaster('kyoshitsu', masterKyoshitsu, function() {
    msg.textContent = '✅ ' + name + 'を追加しました'; msg.className = 'status-msg status-ok';
    document.getElementById('newKyoshitsuName').value = '';
    renderAll();
  });
}

function deleteKyoshitsu(name) {
  if (!confirm(name + 'を削除しますか？\n（この教室の生徒データも削除されます）')) return;
  var idx = masterKyoshitsu.indexOf(name);
  if (idx >= 0) masterKyoshitsu.splice(idx, 1);
  delete masterStudents[name];
  delete masterTeachers[name];
  delete masterNotionPages[name];
  saveMaster('kyoshitsu', masterKyoshitsu, function() {
    saveMaster('students', masterStudents, function() {
      saveMaster('teachers', masterTeachers, function() {
        saveMaster('notionPages', masterNotionPages, function() {
          renderAll(); showSaveStatus(name + 'を削除しました');
        });
      });
    });
  });
}

// ===== KV保存 =====
function saveMaster(type, data, cb) {
  fetch(WORKER_URL + '/save-master', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: type, data: data })
  }).then(function(r) { return r.json(); })
  .then(function() { if (cb) cb(); })
  .catch(function(e) { console.log('保存エラー:', e); if (cb) cb(); });
}

function showSaveStatus(msg) {
  var el = document.getElementById('saveStatus');
  el.textContent = msg;
  setTimeout(function() { el.textContent = ''; }, 3000);
}

// ===== タブ =====
function switchTab(name) {
  ['students','teachers','kyoshitsu','transport','timecard','monthly'].forEach(function(n) {
    document.getElementById('tab-' + n).classList.toggle('active', n === name);
    document.getElementById('view-' + n).classList.toggle('active', n === name);
  });
  if (name === 'transport') renderTransportList();
  if (name === 'timecard') {
    var today = getTodayStr();
    if (!document.getElementById('tcFilterDate').value) {
      document.getElementById('tcFilterDate').value = today;
    }
    if (!document.getElementById('tcAddDate').value) {
      document.getElementById('tcAddDate').value = today;
    }
    loadTimecardHistory();
  }
  if (name === 'monthly') {
    if (!document.getElementById('monthlyMonth').value) {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, '0');
      document.getElementById('monthlyMonth').value = y + '-' + m;
    }
  }
}

// ===== 交通費 =====
var masterTransport = {}; // { 講師名: 金額 }

function onTransportKyoshitsuChange() {
  var ky = document.getElementById('transportKyoshitsu').value;
  var sel = document.getElementById('transportTeacher');
  sel.innerHTML = '<option value="">-- 講師を選択 --</option>';
  if (!ky) return;
  var teachers = masterTeachers[ky] || [];
  teachers.forEach(function(t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
}

function saveTransport() {
  var ky = document.getElementById('transportKyoshitsu').value;
  var teacher = document.getElementById('transportTeacher').value;
  var amountStr = document.getElementById('transportAmount').value.trim().replace(/[,，]/g,'');
  var msg = document.getElementById('transportMsg');
  if (!ky || !teacher) { msg.textContent = '教室と講師を選択してください'; msg.className = 'status-msg status-err'; return; }
  var amount = parseInt(amountStr);
  if (isNaN(amount) || amount < 0) { msg.textContent = '金額は0以上の数字で入力してください'; msg.className = 'status-msg status-err'; return; }
  masterTransport[teacher] = amount;
  saveMaster('transport', masterTransport, function() {
    msg.textContent = '✅ ' + teacher + ' の交通費を ' + amount.toLocaleString() + ' 円で登録しました';
    msg.className = 'status-msg status-ok';
    document.getElementById('transportAmount').value = '';
    renderTransportList();
  });
}

function deleteTransport(teacher) {
  if (!confirm(teacher + ' の交通費を削除しますか？')) return;
  delete masterTransport[teacher];
  saveMaster('transport', masterTransport, function() {
    renderTransportList();
    showSaveStatus(teacher + ' の交通費を削除しました');
  });
}

function renderTransportList() {
  var wrap = document.getElementById('transportListWrap');
  var keys = Object.keys(masterTransport);
  if (keys.length === 0) {
    wrap.innerHTML = '<div class="empty">交通費が登録されていません</div>';
    return;
  }
  // 教室ごとにグループ化して表示
  wrap.innerHTML = '';
  masterKyoshitsu.forEach(function(ky) {
    var teachers = masterTeachers[ky] || [];
    var rows = teachers.filter(function(t) { return masterTransport[t] !== undefined; });
    if (rows.length === 0) return;
    var block = document.createElement('div');
    block.style.marginBottom = '1rem';
    var ttl = document.createElement('div');
    ttl.style.cssText = 'font-size:12px;font-weight:500;color:#666;margin-bottom:4px';
    ttl.textContent = ky;
    block.appendChild(ttl);
    rows.forEach(function(t) {
      var row = document.createElement('div');
      row.className = 'transport-row';
      var kyBadge = document.createElement('span'); kyBadge.className = 'transport-ky'; kyBadge.textContent = ky;
      var name = document.createElement('span'); name.className = 'transport-name'; name.textContent = t;
      var amt = document.createElement('span'); amt.className = 'transport-amount'; amt.textContent = masterTransport[t].toLocaleString() + ' 円';
      var del = document.createElement('button'); del.className = 'transport-del'; del.textContent = '削除';
      (function(t2){ del.onclick = function(){ deleteTransport(t2); }; })(t);
      row.appendChild(kyBadge); row.appendChild(name); row.appendChild(amt); row.appendChild(del);
      block.appendChild(row);
    });
    wrap.appendChild(block);
  });
}

// ===== 月次集計 =====
function loadMonthlySummary() {
  var month = document.getElementById('monthlyMonth').value;
  var ky    = document.getElementById('monthlyKyoshitsu').value;
  var msg   = document.getElementById('monthlyMsg');

  if (!month) { msg.textContent = '対象月を選択してください'; msg.className = 'status-msg status-err'; return; }
  if (!ky)    { msg.textContent = '教室を選択してください';   msg.className = 'status-msg status-err'; return; }

  msg.textContent = '取得中...'; msg.className = 'status-msg';
  document.getElementById('monthlySummarySection').style.display = 'none';

  var url = WORKER_URL + '/get-timecard?month=' + month + '&kyoshitsu=' + encodeURIComponent(ky);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      msg.textContent = '';
      renderMonthlySummary(data.records || [], month, ky);
    })
    .catch(function(){
      msg.textContent = '⚠️ 取得できませんでした'; msg.className = 'status-msg status-err';
    });
}

function renderMonthlySummary(records, month, ky) {
  // 日付ごと・講師ごとにグループ化（最新の打刻を優先：timestamp降順）
  // key: teacher+'|'+date → { inTime, outTime }
  var raw = {}; // teacher+'|'+date → { ins:[{timeStr,ts}], outs:[{timeStr,ts}] }
  records.forEach(function(rec) {
    var key = (rec.teacher || '') + '|' + (rec.date || '');
    if (!raw[key]) raw[key] = { ins: [], outs: [] };
    if (rec.type === 'in')  raw[key].ins.push({ timeStr: rec.timeStr, ts: rec.timestamp || 0 });
    if (rec.type === 'out') raw[key].outs.push({ timeStr: rec.timeStr, ts: rec.timestamp || 0 });
  });

  // 最新のin/outを採用（timestamp最大のものを使う）
  var grouped = {}; // teacher+'|'+date → { inTime, outTime, workMin }
  Object.keys(raw).forEach(function(key) {
    var d = raw[key];
    var inRec  = d.ins.sort(function(a,b){ return b.ts - a.ts; })[0]  || null;
    var outRec = d.outs.sort(function(a,b){ return b.ts - a.ts; })[0] || null;
    var inTime  = inRec  ? inRec.timeStr  : null;
    var outTime = outRec ? outRec.timeStr : null;
    var workMin = 0;
    if (inTime && outTime) {
      workMin = toTcMinutes(outTime) - toTcMinutes(inTime);
      if (workMin < 0) workMin = 0;
    }
    grouped[key] = { inTime: inTime, outTime: outTime, workMin: workMin };
  });

  // 月の全日付を生成
  var year  = parseInt(month.split('-')[0]);
  var monthN = parseInt(month.split('-')[1]);
  var daysInMonth = new Date(year, monthN, 0).getDate();
  var allDates = [];
  for (var d = 1; d <= daysInMonth; d++) {
    allDates.push(year + '-' + String(monthN).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
  }

  // 対象教室の講師リストを取得
  var teachers = masterTeachers[ky] || [];
  if (teachers.length === 0) {
    // recordsから講師名を抽出
    var seen = {};
    records.forEach(function(r){ if (r.teacher) seen[r.teacher] = true; });
    teachers = Object.keys(seen).sort();
  }

  if (teachers.length === 0) {
    document.getElementById('monthlySummaryWrap').innerHTML = '<div class="empty">打刻記録がありません</div>';
    document.getElementById('monthlySummarySection').style.display = 'block';
    document.getElementById('monthlySummaryTitle').textContent = month.replace('-','年') + '月　' + ky + '　勤務時間一覧';
    return;
  }

  // 出勤日のある日だけ列を表示（全日表示すると広すぎるため）
  var activeDates = allDates.filter(function(dt) {
    return teachers.some(function(t) {
      return grouped[t + '|' + dt] && grouped[t + '|' + dt].inTime;
    });
  });

  // テーブル生成
  var table = document.createElement('table');
  table.className = 'monthly-table';

  // ヘッダ行
  var thead = document.createElement('thead');
  var headTr = document.createElement('tr');
  var thName = document.createElement('th');
  thName.className = 'teacher-col'; thName.textContent = '講師名';
  headTr.appendChild(thName);
  activeDates.forEach(function(dt) {
    var th = document.createElement('th');
    var d = parseInt(dt.split('-')[2]);
    var w = ['日','月','火','水','木','金','土'][new Date(dt).getDay()];
    th.textContent = d + '/' + (['日','土'].indexOf(w) >= 0 ? w : w);
    if (w === '日') th.style.color = '#c00';
    if (w === '土') th.style.color = '#0055cc';
    headTr.appendChild(th);
  });
  var thTotal = document.createElement('th');
  thTotal.textContent = '月合計'; thTotal.style.background = '#EEEDFE'; thTotal.style.color = '#3C3489';
  headTr.appendChild(thTotal);
  thead.appendChild(headTr);
  table.appendChild(thead);

  // データ行
  var tbody = document.createElement('tbody');
  teachers.forEach(function(teacher) {
    var tr = document.createElement('tr');
    var tdName = document.createElement('td');
    tdName.className = 'teacher-cell'; tdName.textContent = teacher;
    tr.appendChild(tdName);

    var totalMin = 0;
    activeDates.forEach(function(dt) {
      var td = document.createElement('td');
      var rec = grouped[teacher + '|' + dt];
      if (rec && rec.inTime) {
        var rangeDiv = document.createElement('div'); rangeDiv.className = 'time-range';
        rangeDiv.textContent = rec.inTime + '〜' + (rec.outTime || '?');
        var durDiv = document.createElement('div'); durDiv.className = 'time-dur';
        durDiv.textContent = rec.workMin > 0 ? '(' + minToHM(rec.workMin) + ')' : '(退勤未記録)';
        if (!rec.outTime) durDiv.style.color = '#c00';
        td.appendChild(rangeDiv); td.appendChild(durDiv);
        totalMin += rec.workMin;
      } else {
        td.innerHTML = '<span class="no-record">—</span>';
      }
      tr.appendChild(td);
    });

    var tdTotal = document.createElement('td');
    tdTotal.className = 'total-cell';
    tdTotal.textContent = totalMin > 0 ? minToHM(totalMin) : '—';
    tr.appendChild(tdTotal);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  var wrap = document.getElementById('monthlySummaryWrap');
  wrap.innerHTML = '';
  wrap.appendChild(table);

  var titleEl = document.getElementById('monthlySummaryTitle');
  titleEl.textContent = month.replace('-','年') + '月　' + ky + '　勤務時間一覧';
  document.getElementById('monthlySummarySection').style.display = 'block';
}

function minToHM(min) {
  if (!min || min <= 0) return '0h';
  var h = Math.floor(min / 60);
  var m = min % 60;
  return h + 'h' + (m > 0 ? m + 'm' : '');
}
function onTcAddKyoshitsuChange() {
  var ky = document.getElementById('tcAddKyoshitsu').value;
  var sel = document.getElementById('tcAddTeacher');
  sel.innerHTML = '<option value="">-- 講師を選択 --</option>';
  if (!ky) return;
  (masterTeachers[ky] || []).forEach(function(t) {
    var o = document.createElement('option');
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
}

function addTimecardManual() {
  var ky      = document.getElementById('tcAddKyoshitsu').value;
  var teacher = document.getElementById('tcAddTeacher').value;
  var date    = document.getElementById('tcAddDate').value;
  var inTime  = document.getElementById('tcAddIn').value.trim();
  var outTime = document.getElementById('tcAddOut').value.trim();
  var msg     = document.getElementById('tcAddMsg');

  // バリデーション
  var errors = [];
  if (!ky)      errors.push('教室を選択してください');
  if (!teacher) errors.push('講師を選択してください');
  if (!date)    errors.push('日付を入力してください');
  if (!inTime)  errors.push('出勤時刻を入力してください');
  if (inTime  && !/^\d{1,2}:\d{2}$/.test(inTime))  errors.push('出勤時刻の形式が正しくありません（例：16:30）');
  if (outTime && !/^\d{1,2}:\d{2}$/.test(outTime)) errors.push('退勤時刻の形式が正しくありません（例：21:20）');
  if (errors.length > 0) {
    msg.textContent = errors[0];
    msg.className = 'status-msg status-err';
    return;
  }

  var ts = Date.now();
  var promises = [];

  promises.push(fetch(WORKER_URL + '/clock', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kyoshitsu: ky, teacher: teacher, date: date, type: 'in', timeStr: inTime, timestamp: ts, edited: true })
  }));

  if (outTime) {
    promises.push(fetch(WORKER_URL + '/clock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kyoshitsu: ky, teacher: teacher, date: date, type: 'out', timeStr: outTime, timestamp: ts + 1, edited: true })
    }));
  }

  msg.textContent = '保存中...';
  msg.className = 'status-msg';

  Promise.all(promises).then(function() {
    msg.textContent = '✅ ' + teacher + '（' + date + '）の打刻を追加しました';
    msg.className = 'status-msg status-ok';
    // 入力欄をリセット
    document.getElementById('tcAddIn').value = '';
    document.getElementById('tcAddOut').value = '';
    // 履歴を再読み込み（追加した日付で絞り込み）
    document.getElementById('tcFilterDate').value = date;
    loadTimecardHistory();
  }).catch(function() {
    msg.textContent = '⚠️ 保存に失敗しました';
    msg.className = 'status-msg status-err';
  });
}

// ===== 打刻履歴管理 =====
var _tcEditing = null; // 現在編集中のグループキー情報

function getTodayStr() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth()+1).padStart(2,'0');
  var d = String(now.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + d;
}

function loadTimecardHistory() {
  var ky = document.getElementById('tcFilterKyoshitsu').value;
  var date = document.getElementById('tcFilterDate').value;
  var url = WORKER_URL + '/get-timecard?';
  var params = [];
  if (ky) params.push('kyoshitsu=' + encodeURIComponent(ky));
  if (date) params.push('date=' + date);
  url += params.join('&');

  document.getElementById('tcListWrap').innerHTML = '<div class="empty">読み込み中...</div>';
  document.getElementById('tcEditSection').style.display = 'none';

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){ renderTimecardList(data.records || []); })
    .catch(function(){ document.getElementById('tcListWrap').innerHTML = '<div class="empty">取得できませんでした</div>'; });
}

function renderTimecardList(records) {
  var wrap = document.getElementById('tcListWrap');
  if (records.length === 0) { wrap.innerHTML = '<div class="empty">打刻記録はありません</div>'; return; }

  // グループ化：日付+教室+講師
  var groups = {};
  records.forEach(function(rec) {
    var key = rec.date + '|' + rec.kyoshitsu + '|' + rec.teacher;
    if (!groups[key]) groups[key] = { date: rec.date, kyoshitsu: rec.kyoshitsu, teacher: rec.teacher, ins: [], outs: [], rawKeys: [] };
    if (rec.type === 'in') groups[key].ins.push(rec.timeStr);
    else groups[key].outs.push(rec.timeStr);
  });

  var keys = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });
  wrap.innerHTML = '';

  keys.forEach(function(key) {
    var g = groups[key];
    var inTime = g.ins[0] || null;
    var outTime = g.outs[0] || null;
    var isWorking = inTime && !outTime;

    var item = document.createElement('div');
    item.className = 'tc-item';

    var header = document.createElement('div');
    header.className = 'tc-header';
    var nameEl = document.createElement('span'); nameEl.className = 'tc-name'; nameEl.textContent = g.teacher;
    var kyEl = document.createElement('span'); kyEl.className = 'tc-ky'; kyEl.textContent = g.kyoshitsu;
    var dateEl = document.createElement('span'); dateEl.className = 'tc-date'; dateEl.textContent = g.date;
    var editBtn = document.createElement('button'); editBtn.className = 'tc-edit-btn'; editBtn.textContent = '修正';
    (function(g2){ editBtn.onclick = function(){ openTimecardEdit(g2); }; })(g);
    header.appendChild(nameEl); header.appendChild(kyEl); header.appendChild(dateEl); header.appendChild(editBtn);

    var times = document.createElement('div');
    times.className = 'tc-times';

    var inEl = document.createElement('div'); inEl.className = 'tc-time-item';
    var inBadge = document.createElement('span'); inBadge.className = 'tc-badge-in'; inBadge.textContent = '出勤';
    var inVal = document.createElement('span'); inVal.textContent = inTime || '---';
    inEl.appendChild(inBadge); inEl.appendChild(inVal);

    var outEl = document.createElement('div'); outEl.className = 'tc-time-item';
    var outBadge = document.createElement('span');
    var outVal = document.createElement('span');
    if (isWorking) {
      outBadge.className = 'tc-badge-working'; outBadge.textContent = '勤務中';
      outVal.textContent = '';
    } else {
      outBadge.className = 'tc-badge-out'; outBadge.textContent = '退勤';
      outVal.textContent = outTime || '---';
    }
    outEl.appendChild(outBadge); outEl.appendChild(outVal);

    var durEl = document.createElement('span'); durEl.className = 'tc-dur';
    if (inTime && outTime) {
      var diff = toTcMinutes(outTime) - toTcMinutes(inTime);
      if (diff > 0) durEl.textContent = Math.floor(diff/60) + 'h' + (diff%60) + 'm';
    }

    times.appendChild(inEl); times.appendChild(outEl); times.appendChild(durEl);
    item.appendChild(header); item.appendChild(times);
    wrap.appendChild(item);
  });
}

function toTcMinutes(t) {
  var p = t.split(':');
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}

function openTimecardEdit(g) {
  _tcEditing = g;
  document.getElementById('tcEditTitle').textContent = g.teacher + '（' + g.date + '）の打刻を修正';
  document.getElementById('tcEditIn').value = g.ins[0] || '';
  document.getElementById('tcEditOut').value = g.outs[0] || '';
  document.getElementById('tcEditMsg').textContent = '';
  document.getElementById('tcEditSection').style.display = 'block';
  document.getElementById('tcEditSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function cancelTimecardEdit() {
  _tcEditing = null;
  document.getElementById('tcEditSection').style.display = 'none';
}

function applyTimecardEdit() {
  if (!_tcEditing) return;
  var inTime = document.getElementById('tcEditIn').value.trim();
  var outTime = document.getElementById('tcEditOut').value.trim();
  var msg = document.getElementById('tcEditMsg');

  if (inTime && !/^\d{1,2}:\d{2}$/.test(inTime)) { msg.textContent = '出勤時刻の形式が正しくありません（例：16:30）'; msg.className = 'status-msg status-err'; return; }
  if (outTime && !/^\d{1,2}:\d{2}$/.test(outTime)) { msg.textContent = '退勤時刻の形式が正しくありません（例：21:20）'; msg.className = 'status-msg status-err'; return; }

  var g = _tcEditing;
  var ts = Date.now();
  var promises = [];

  // 修正版を保存：既存レコードは上書きできないためtype+suffixで別保存し、
  // Worker側で最新の修正を優先させる（今回はシンプルに追記する方式）
  if (inTime) {
    promises.push(fetch(WORKER_URL + '/clock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kyoshitsu: g.kyoshitsu, teacher: g.teacher, date: g.date, type: 'in', timeStr: inTime, timestamp: ts, edited: true })
    }));
  }
  if (outTime) {
    promises.push(fetch(WORKER_URL + '/clock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kyoshitsu: g.kyoshitsu, teacher: g.teacher, date: g.date, type: 'out', timeStr: outTime, timestamp: ts + 1, edited: true })
    }));
  }

  Promise.all(promises).then(function() {
    msg.textContent = '✅ 修正を保存しました';
    msg.className = 'status-msg status-ok';
    setTimeout(function() {
      cancelTimecardEdit();
      loadTimecardHistory();
    }, 1200);
  }).catch(function() {
    msg.textContent = '⚠️ 保存に失敗しました';
    msg.className = 'status-msg status-err';
  });
}
