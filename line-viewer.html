<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業レポート - 明光義塾</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f4f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:400px;margin:1rem}
h1{font-size:18px;font-weight:500;margin-bottom:.25rem}
.subtitle{font-size:12px;color:#888;margin-bottom:1.75rem;padding-bottom:.75rem;border-bottom:1px solid #eee}
.loading{text-align:center;color:#aaa;font-size:13px;padding:2rem 0}
.desc{font-size:13px;color:#555;line-height:1.7;margin-bottom:1.25rem}
.student-list{display:flex;flex-direction:column;gap:10px}
.student-btn{display:block;width:100%;padding:16px;background:#f5f4f0;border:1px solid #e0e0e0;border-radius:10px;text-align:left;cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s}
.student-btn:hover{background:#EEEDFE;border-color:#7F77DD}
.student-btn:active{transform:scale(.98)}
.student-btn-name{font-size:16px;font-weight:500;color:#1a1a1a;display:block;margin-bottom:2px}
.student-btn-ky{font-size:12px;color:#888}
.icon{font-size:48px;text-align:center;margin:1rem 0}
.msg{font-size:13px;color:#555;line-height:1.7;margin-bottom:1.5rem;text-align:center}
.btn-register{display:block;width:100%;height:52px;border-radius:10px;background:#534AB7;color:#fff;font-size:15px;font-weight:500;line-height:52px;text-decoration:none;text-align:center;margin-top:.75rem}
.btn-retry{width:100%;height:48px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;background:#534AB7;color:#fff;margin-top:.75rem}
</style>
</head>
<body>
<div class="card">
  <h1>授業レポート</h1>
  <div class="subtitle">明光義塾</div>
  <div id="mainArea"><div class="loading">確認中...</div></div>
</div>
<script>
var CLIENT_ID    = '2010459789';
var REDIRECT_URI = 'https://kobetsumeiko-rgb.github.io/juku-report/line-viewer.html';
var WORKER_URL   = 'https://notion-proxy.kobetsu-meiko.workers.dev';

(function init() {
  var params = new URLSearchParams(location.search);
  var code = params.get('code');
  if (code) {
    handleCallback(code);
  } else {
    doLineLogin();
  }
})();

function doLineLogin() {
  var state = Math.random().toString(36).slice(2);
  sessionStorage.setItem('line_state_viewer', state);
  location.href = 'https://access.line.me/oauth2/v2.1/authorize' +
    '?response_type=code&client_id=' + CLIENT_ID +
    '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
    '&state=' + state + '&scope=profile%20openid';
}

function handleCallback(code) {
  document.getElementById('mainArea').innerHTML = '<div class="loading">レポートを確認中...</div>';

  fetch(WORKER_URL + '/line-get-notion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code, redirectUri: REDIRECT_URI })
  })
  .then(function(r){ return r.json(); })
  .then(function(data) {
    if (data.notRegistered) {
      showNotRegistered();
    } else if (data.students && data.students.length === 1) {
      // 1人だけ登録 → 直接Notionへ
      location.href = data.students[0].notionUrl;
    } else if (data.students && data.students.length > 1) {
      // 複数登録 → 選択画面を表示
      showSelectScreen(data.students);
    } else {
      showError();
    }
  })
  .catch(function() { showError(); });
}

function showSelectScreen(students) {
  var html = '<p class="desc">お子様を選んでください</p><div class="student-list">';
  students.forEach(function(s) {
    html += '<a class="student-btn" href="' + s.notionUrl + '" target="_blank">' +
      '<span class="student-btn-name">' + s.student + '</span>' +
      '<span class="student-btn-ky">' + s.kyoshitsu + '</span>' +
      '</a>';
  });
  html += '</div>';
  document.getElementById('mainArea').innerHTML = html;
}

function showNotRegistered() {
  document.getElementById('mainArea').innerHTML =
    '<div class="icon">📋</div>' +
    '<p class="msg">まだ登録が完了していません。<br>下のボタンから初期登録を行ってください。</p>' +
    '<a class="btn-register" href="line-auth.html">初期登録はこちら</a>';
}

function showError() {
  document.getElementById('mainArea').innerHTML =
    '<div class="icon">⚠️</div>' +
    '<p class="msg">エラーが発生しました。<br>もう一度お試しください。</p>' +
    '<button class="btn-retry" onclick="doLineLogin()">再試行</button>';
}
</script>
</body>
</html>
