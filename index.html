<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業報告フォーム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f4f0}
.wrap{max-width:780px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:20px;font-weight:500;margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid #ddd}
.section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:13px;font-weight:500;color:#666;margin-bottom:.75rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:#666;margin-bottom:4px}
select,input[type=text],input[type=date]{width:100%;height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 2px rgba(127,119,221,.15)}
.grade-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.grade-tab{padding:6px 16px;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;background:#fff;color:#666;font-family:inherit}
.grade-tab:hover{background:#f5f5f5}
.grade-tab.active-j1{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-weight:500}
.grade-tab.active-j2{background:#E1F5EE;color:#085041;border-color:#5DCAA5;font-weight:500}
.grade-tab.active-j3{background:#FAECE7;color:#712B13;border-color:#F0997B;font-weight:500}
.grade-tab.active-e1{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-weight:500}
.grade-tab.active-e2{background:#E1F5EE;color:#085041;border-color:#5DCAA5;font-weight:500}
.grade-tab.active-e3{background:#FAECE7;color:#712B13;border-color:#F0997B;font-weight:500}
.unit-table{width:100%;border-collapse:collapse;margin-top:.5rem}
.unit-table th{font-size:12px;font-weight:500;color:#666;padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
.unit-table td{padding:6px 8px;border-bottom:1px solid #eee;font-size:13px;vertical-align:middle}
.unit-table tr:last-child td{border-bottom:none}
.unit-table tr:hover td{background:#fafafa}
.shidou-group{display:flex;gap:4px;margin-bottom:4px}
.shidou-btn{font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:inherit;border:1px solid #ccc;background:#fff;color:#666;opacity:.5;transition:opacity .1s}
.shidou-btn.on-nashi{opacity:1;font-weight:500;background:#E6F1FB;color:#0C447C;border-color:#85B7EB}
.shidou-btn.on-ari{opacity:1;font-weight:500;background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.sub-group{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.sub-btn{font-size:11px;padding:3px 7px;border-radius:4px;cursor:pointer;font-family:inherit;text-align:left;border:1px solid transparent;opacity:.45;transition:opacity .1s}
.sub-btn.on{opacity:1;font-weight:500}
.sub-btn.nashi3{background:#EAF3DE;color:#27500A;border-color:#97C459}
.sub-btn.nashi4{background:#F1EFE8;color:#444441;border-color:#B4B2A9}
.sub-btn.ari5{background:#EAF3DE;color:#27500A;border-color:#97C459}
.sub-btn.ari6{background:#FAEEDA;color:#633806;border-color:#EF9F27}
.sub-btn.ari7{background:#F1EFE8;color:#444441;border-color:#B4B2A9}
.radio-group{display:flex;gap:6px}
.radio-group label{margin:0;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;color:#1a1a1a;white-space:nowrap}
.radio-group input[type=radio]{width:14px;height:14px;margin:0;accent-color:#7F77DD}
.badge-maru{background:#EAF3DE;color:#27500A;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.badge-circle{background:#E6F1FB;color:#0C447C;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.badge-tri{background:#FAEEDA;color:#633806;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.accuracy-group{display:flex;gap:4px}
.acc-btn{font-size:11px;padding:3px 7px;border:1px solid #ccc;border-radius:4px;cursor:pointer;background:#fff;color:#666;font-family:inherit}
.acc-btn:hover{background:#f5f5f5}
.acc-btn.sel-low{background:#FCEBEB !important;color:#791F1F !important;border-color:#F09595 !important}
.acc-btn.sel-mid{background:#FAEEDA !important;color:#633806 !important;border-color:#FAC775 !important}
.acc-btn.sel-high{background:#EAF3DE !important;color:#27500A !important;border-color:#C0DD97 !important}
.saved-badge{font-size:11px;background:#E1F5EE;color:#085041;border-radius:4px;padding:1px 7px;margin-left:6px}
.empty-msg{text-align:center;padding:2rem;color:#999;font-size:13px}
.submit-btn{display:block;width:100%;padding:12px;background:#534AB7;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:1.5rem;font-family:inherit}
.submit-btn:hover{background:#7F77DD}
.submit-btn:active{transform:scale(.98)}
.preview-box{background:#f5f4f0;border:1px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-top:1rem;display:none}
.preview-box pre{font-family:'Courier New',monospace;font-size:12px;color:#1a1a1a;white-space:pre-wrap;word-break:break-all}
.unit-count{font-size:12px;color:#666;background:#f5f4f0;border-radius:4px;padding:2px 8px}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:.75rem}
.hint{font-size:11px;color:#666;margin-bottom:.75rem;line-height:1.7}
.copy-btn{margin-top:1rem;padding:8px 16px;background:#f5f4f0;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;color:#1a1a1a;font-family:inherit}
.copy-btn:hover{background:#eee}
@media(max-width:500px){.row{grid-template-columns:1fr}.accuracy-group{flex-wrap:wrap}}
.policy-checks{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.policy-checks label{display:flex;align-items:center;gap:8px;font-size:13px;color:#1a1a1a;cursor:pointer}
.policy-checks input[type=checkbox]{width:15px;height:15px;accent-color:#7F77DD;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
<h1>授業報告フォーム</h1>

<div class="section">
  <div class="section-title">基本情報</div>
  <div class="row">
    <div><label>授業日</label><input type="date" id="lessonDate"></div>
    <div><label>担当講師</label><select id="teacherName">
      <option value="">-- 講師を選択 --</option>
      <option value="浅村結良">浅村結良</option>
      <option value="小林祐介">小林祐介</option>
      <option value="高澤雅樹">高澤雅樹</option>
      <option value="藤田雅子">藤田雅子</option>
      <option value="原口葵">原口葵</option>
      <option value="水野貴志">水野貴志</option>
      <option value="宮崎久仁子">宮崎久仁子</option>
      <option value="緑川智洸">緑川智洸</option>
    </select></div>
  </div>
  <div class="row">
    <div>
      <label>学年</label>
      <select id="gradeSelect" onchange="onGradeChange()">
        <option value="">-- 学年を選択 --</option>
        <option value="小3">小学3年生</option><option value="小4">小学4年生</option>
        <option value="小5">小学5年生</option><option value="小6">小学6年生</option>
        <option value="中1">中学1年生</option><option value="中2">中学2年生</option>
        <option value="中3">中学3年生</option>
        <option value="高1">高校1年生</option><option value="高2">高校2年生</option><option value="高3">高校3年生</option>
      </select>
    </div>
    <div>
      <label>生徒名</label>
      <select id="studentSelect"><option value="">-- 先に学年を選択 --</option></select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>授業への集中度</label>
      <select id="focusSelect">
        <option value="">-- 選択してください --</option>
        <option value="集中できていた">○ 集中できていた</option>
        <option value="眠そうにしていた">眠そうにしていた</option>
        <option value="ボーっとしてしまうことがあった">ボーっとしてしまうことがあった</option>
        <option value="席を5分以上離れることがあった">席を5分以上離れることがあった</option>
        <option value="2回以上席を離れた">2回以上席を離れた</option>
        <option value="文具や筆箱その他のもので勉強以外のことをしてしまう">文具や筆箱その他のもので勉強以外のことをしてしまう</option>
      </select>
    </div>
    <div>
      <label>科目</label>
      <select id="subjectSelect" onchange="onSubjectChange()">
        <option value="">-- 先に学年を選択 --</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>宿題の実施状況</label>
      <select id="homeworkStatus">
        <option value="">-- 選択してください --</option>
        <option value="100%">100%（完璧にやってきた）</option>
        <option value="50%以上">50%以上（半分以上やってきた）</option>
        <option value="50%未満">50%未満（あまりやってきていない）</option>
        <option value="0%">0%（やってきていない）</option>
        <option value="ノート忘れのため確認できなかった">ノート忘れのため確認できなかった</option>
      </select>
    </div>
    <div>
      <label>テスト範囲のカバー率</label>
      <select id="testCoverage">
        <option value="">-- 選択してください --</option>
        <option value="100%">100%（全範囲カバーできた）</option>
        <option value="75%">75%（おおよそカバーできた）</option>
        <option value="50%未満">50%未満（半分以下）</option>
        <option value="テスト範囲不明">テスト範囲不明</option>
      </select>
    </div>
  </div>
  <div style="margin-bottom:12px">
    <label>授業方針（複数選択可）</label>
    <div class="policy-checks">
      <label><input type="checkbox" value="現行単元の補習"> 現行単元の補習</label>
      <label><input type="checkbox" value="既習単元のさかのぼり"> 既習単元のさかのぼり</label>
      <label><input type="checkbox" value="未習単元の先取り"> 未習単元の先取り</label>
      <label><input type="checkbox" value="テスト対策"> テスト対策</label>
      <label><input type="checkbox" value="検定対策"> 検定対策</label>
      <label><input type="checkbox" value="学校課題のフォロー"> 学校課題のフォロー</label>
    </div>
  </div>
</div>

<div class="section" id="unitSection" style="display:none">
  <div class="section-header">
    <div class="section-title" style="margin:0">単元・理解度の記録</div>
    <span class="unit-count" id="unitCount"></span>
  </div>
  <div class="hint">
    <b>Step1</b>　①指導なし　②指導あり　を選択<br>
    <b>①指導なし のとき →</b>　③もともとよくできていた　④次回以降も要フォロー<br>
    <b>②指導あり のとき →</b>　⑤よくできるようになった　⑥自力正答率はもう一歩　⑦次回以降も要フォロー
  </div>
  <div id="mathGradeTabs" style="display:none">
    <div style="font-size:12px;color:#666;margin-bottom:6px">実施単元の学年を選択（タブを切り替えても入力内容は保持されます）</div>
    <div class="grade-tabs" id="gradeTabsInner"></div>
  </div>
  <div id="unitPanelsWrap"></div>
  <div id="engIssueSection" style="display:none;margin-top:1rem;border-top:1px solid #eee;padding-top:1rem">
    <div style="font-size:13px;font-weight:500;color:#666;margin-bottom:.5rem">英語の課題（該当するものをすべて選択）</div>
    <div id="engIssueChecks"></div>
  </div>
  <div id="mathIssueSection" style="display:none;margin-top:1rem;border-top:1px solid #eee;padding-top:1rem">
    <div style="font-size:13px;font-weight:500;color:#666;margin-bottom:.5rem">数学の課題（該当するものをすべて選択）</div>
    <div id="mathIssueChecks"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">具体的にできたこと・できるようになったこと・できないこと</div>
  <textarea id="commentBox" rows="5" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;resize:vertical" placeholder="例）比例のグラフは自力で書けるようになった。ヒストグラムの読み取りは正確にできる。応用問題での式の立て方がまだ難しい。"></textarea>
</div>

<button class="submit-btn" onclick="submitReport()">授業報告をプレビューする</button>

<div class="preview-box" id="previewBox">
  <div style="font-size:13px;font-weight:500;margin-bottom:.5rem;color:#666">報告内容プレビュー</div>
  <pre id="previewContent"></pre>
  <button class="copy-btn" onclick="generateNotion()">Notion記録用文を生成する ↗</button>
</div>
</div>

var currentTag=null;

function onGradeChange(){
  var g=document.getElementById('gradeSelect').value;
  var ss=document.getElementById('studentSelect');
  var subj=document.getElementById('subjectSelect');
  ss.innerHTML='<option value="">-- 生徒を選択 --</option>';
  subj.innerHTML='<option value="">-- 科目を選択 --</option>';
  document.getElementById('unitSection').style.display='none';
  currentTag=null;
  if(!g)return;
  (STUDENTS[g]||[]).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o);});
  (SUBJECTS[g]||[]).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;subj.appendChild(o);});
}

function getSubjectKey(grade,subj){
  if(subj==="算数"){if(grade==="小4")return"算数（小4）";if(grade==="小5")return"算数（小5）";if(grade==="小6")return"算数（小6）";}
  if(subj==="国語")return grade.indexOf("高")===0?"国語（高）":"国語（中）";
  if(subj==="英語")return grade.indexOf("高")===0?"英語（高）":"英語（中）";
  if(subj==="理科")return"理科（中）";
  if(subj==="社会")return"社会（中）";
  return subj;
}

function buildIssueChecks(items,wrapId,prefix){
  var wrap=document.getElementById(wrapId);
  wrap.innerHTML='';
  items.forEach(function(item,i){
    var lbl=document.createElement('label');
    lbl.style.cssText='display:flex;align-items:center;gap:8px;font-size:13px;color:#1a1a1a;cursor:pointer';
    var cb=document.createElement('input');
    cb.type='checkbox';cb.id=prefix+'_'+i;cb.value=item;
    cb.style.cssText='width:15px;height:15px;accent-color:#7F77DD;flex-shrink:0';
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(item));
    wrap.appendChild(lbl);
  });
}

function onSubjectChange(){
  var g=document.getElementById('gradeSelect').value;
  var s=document.getElementById('subjectSelect').value;
  var sec=document.getElementById('unitSection');
  var tabsArea=document.getElementById('mathGradeTabs');
  var wrap=document.getElementById('unitPanelsWrap');
  var engSec=document.getElementById('engIssueSection');
  var mathSec=document.getElementById('mathIssueSection');
  if(!g||!s){sec.style.display='none';return;}
  sec.style.display='block';
  currentTag=null;
  wrap.innerHTML='';
  tabsArea.style.display='none';
  var isEng=(s==="英語");
  var isMath=(s==="数学"||s==="数学Ⅰ"||s==="数学A"||s==="数学Ⅱ"||s==="数学B"||s==="数学Ⅲ"||s==="数学C"||s==="算数");
  var isEngTab=(isEng&&(g==="中2"||g==="中3"));
  engSec.style.display=isEng?'block':'none';
  mathSec.style.display=isMath?'block':'none';
  if(isEng)buildIssueChecks(ENG_ISSUES,'engIssueChecks','eng_issue');
  if(isMath)buildIssueChecks(MATH_ISSUES,'mathIssueChecks','math_issue');
  if(s==="数学"&&MATH_BY_GRADE[g]){
    tabsArea.style.display='block';
    buildMathPanels(g);
    document.getElementById('unitCount').textContent='学年タブを選択してください';
  } else if(isEngTab&&ENG_BY_GRADE[g]){
    tabsArea.style.display='block';
    buildEngTabs(g);
    document.getElementById('unitCount').textContent='学年タブを選択してください';
  } else if(HIGH_MATH[s]&&HIGH_MATH[s].length>1){
    tabsArea.style.display='block';
    buildHighMathTabs(s);
    document.getElementById('unitCount').textContent='単元を選択してください';
  } else {
    var key=getSubjectKey(g,s);
    var units;
    if(HIGH_MATH[s]&&HIGH_MATH[s].length===1){
      units=HIGH_MATH[s][0].units;
    } else if(isEng&&g==="中1"){
      units=ENG_J1;
    } else {
      units=GENERIC_UNITS[key];
    }
    if(units&&units.length>0){var panel=buildUnitPanel(units,null);panel.style.display='block';wrap.appendChild(panel);}
    else{wrap.innerHTML='<div class="empty-msg">この科目の単元は随時追加されます</div>';}
    updateUnitCount();
  }
}

function buildHighMathTabs(subj){
  var inner=document.getElementById('gradeTabsInner');
  var wrap=document.getElementById('unitPanelsWrap');
  inner.innerHTML='';wrap.innerHTML='';
  var groups=HIGH_MATH[subj]||[];
  var colors=['active-j1','active-j2','active-j3','active-e1','active-e2'];
  groups.forEach(function(g,i){
    var btn=document.createElement('button');
    btn.className='grade-tab';btn.id='tab_'+g.tag;btn.textContent=g.label;
    var panel=buildUnitPanel(g.units,g.tag);panel.id='panel_'+g.tag;wrap.appendChild(panel);
    var color=colors[i%colors.length];
    (function(tag,col){btn.addEventListener('click',function(){
      groups.forEach(function(gg){
        var b=document.getElementById('tab_'+gg.tag);if(!b)return;
        b.style.opacity='1';
        b.className=gg.tag===tag?'grade-tab '+col:'grade-tab';
        if(gg.tag!==tag)b.style.opacity='0.45';
        var p=document.getElementById('panel_'+gg.tag);
        if(p)p.style.display=gg.tag===tag?'block':'none';
      });
      updateUnitCount();
    });})(g.tag,color);
    inner.appendChild(btn);
  });
}

function buildEngTabs(studentGrade){
  var inner=document.getElementById('gradeTabsInner');
  var wrap=document.getElementById('unitPanelsWrap');
  inner.innerHTML='';wrap.innerHTML='';
  var groups=ENG_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.createElement('button');
    btn.className='grade-tab';btn.id='tab_'+g.tag;btn.textContent=g.label+'の内容';
    var panel=buildUnitPanel(g.units,g.tag);panel.id='panel_'+g.tag;wrap.appendChild(panel);
    (function(tag){btn.addEventListener('click',function(){switchEngTab(studentGrade,tag);});})(g.tag);
    inner.appendChild(btn);
  });
}

function switchEngTab(studentGrade,tag){
  var groups=ENG_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.getElementById('tab_'+g.tag);if(!btn)return;
    btn.style.opacity='1';
    var eColor=tag==='e3'?'active-e3':tag==='e2'?'active-e2':'active-e1';
    if(g.tag===tag){btn.className='grade-tab '+eColor;}else{btn.className='grade-tab';btn.style.opacity='0.45';}
    var panel=document.getElementById('panel_'+g.tag);
    if(panel)panel.style.display=(g.tag===tag)?'block':'none';
  });
  updateUnitCount();
}

function buildMathPanels(studentGrade){
  var inner=document.getElementById('gradeTabsInner');
  var wrap=document.getElementById('unitPanelsWrap');
  inner.innerHTML='';
  wrap.innerHTML='';
  var groups=MATH_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.createElement('button');
    btn.className='grade-tab';
    btn.id='tab_'+g.tag;
    btn.textContent=g.label+'の内容';
    var panel=buildUnitPanel(g.units,g.tag);
    panel.id='panel_'+g.tag;
    wrap.appendChild(panel);
    (function(tag){
      btn.addEventListener('click',function(){switchMathTab(studentGrade,tag);});
    })(g.tag);
    inner.appendChild(btn);
  });
}

function switchMathTab(studentGrade,tag){
  var groups=MATH_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.getElementById('tab_'+g.tag);
    if(!btn)return;
    btn.style.opacity='1';
    if(g.tag===tag){btn.className='grade-tab active-'+tag;}
    else{btn.className='grade-tab';btn.style.opacity='0.45';}
    var panel=document.getElementById('panel_'+g.tag);
    if(panel)panel.style.display=(g.tag===tag)?'block':'none';
  });
  currentTag=tag;
  updateUnitCount();
}

function buildUnitPanel(units,tag){
  var panel=document.createElement('div');
  panel.style.display='none';
  var tbl=document.createElement('table');
  tbl.className='unit-table';
  tbl.innerHTML='<thead><tr><th style="width:30%">単元名</th><th style="width:25%">指導</th><th>評価</th></tr></thead>';
  var tb=document.createElement('tbody');
  units.forEach(function(u,i){
    var tr=document.createElement('tr');
    var tdName=document.createElement('td');
    tdName.style.fontSize='12px';tdName.textContent=u;
    var tdShidou=document.createElement('td');
    var shidouGrp=document.createElement('div');shidouGrp.className='shidou-group';
    var btnNashi=document.createElement('button');btnNashi.className='shidou-btn';btnNashi.textContent='①指導なし';
    var btnAri=document.createElement('button');btnAri.className='shidou-btn';btnAri.textContent='②指導あり';
    shidouGrp.appendChild(btnNashi);shidouGrp.appendChild(btnAri);
    tdShidou.appendChild(shidouGrp);
    var tdSub=document.createElement('td');
    var subWrap=document.createElement('div');subWrap.className='sub-group';
    tdSub.appendChild(subWrap);
    (function(bn,ba,sw,t){
      bn.addEventListener('click',function(){
        bn.className='shidou-btn on-nashi';ba.className='shidou-btn';
        sw.innerHTML='';
        SUB_NASHI.forEach(function(opt){
          var sb=document.createElement('button');
          sb.className='sub-btn '+opt.cls;sb.dataset.val=opt.val;sb.textContent=opt.val;
          sb.addEventListener('click',function(){
            sw.querySelectorAll('.sub-btn').forEach(function(b){b.classList.remove('on');});
            sb.classList.add('on');updateTabBadge(t);
          });
          sw.appendChild(sb);
        });
        updateTabBadge(t);
      });
      ba.addEventListener('click',function(){
        ba.className='shidou-btn on-ari';bn.className='shidou-btn';
        sw.innerHTML='';
        SUB_ARI.forEach(function(opt){
          var sb=document.createElement('button');
          sb.className='sub-btn '+opt.cls;sb.dataset.val=opt.val;sb.textContent=opt.val;
          sb.addEventListener('click',function(){
            sw.querySelectorAll('.sub-btn').forEach(function(b){b.classList.remove('on');});
            sb.classList.add('on');updateTabBadge(t);
          });
          sw.appendChild(sb);
        });
        updateTabBadge(t);
      });
    })(btnNashi,btnAri,subWrap,tag);
    tr.appendChild(tdName);tr.appendChild(tdShidou);tr.appendChild(tdSub);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);panel.appendChild(tbl);
  return panel;
}

function updateTabBadge(tag){
  if(!tag)return;
  var panel=document.getElementById('panel_'+tag);
  var btn=document.getElementById('tab_'+tag);
  if(!panel||!btn)return;
  var count=0;
  panel.querySelectorAll('tbody tr').forEach(function(tr){
    if(tr.querySelector('.shidou-btn.on-nashi,.shidou-btn.on-ari'))count++;
  });
  var existing=btn.querySelector('.saved-badge');
  if(existing)existing.remove();
  if(count>0){var badge=document.createElement('span');badge.className='saved-badge';badge.textContent=count+'件';btn.appendChild(badge);}
}

function updateUnitCount(){
  var wrap=document.getElementById('unitPanelsWrap');
  var visible=null;
  wrap.querySelectorAll('div').forEach(function(d){if(d.style.display==='block')visible=d;});
  if(visible){document.getElementById('unitCount').textContent=visible.querySelectorAll('tbody tr').length+'単元';}
}

function submitReport(){
  var date=document.getElementById('lessonDate').value||'（未入力）';
  var teacher=document.getElementById('teacherName').value||'（未入力）';
  var grade=document.getElementById('gradeSelect').value||'（未選択）';
  var student=document.getElementById('studentSelect').value||'（未選択）';
  var focus=document.getElementById('focusSelect').value||'（未選択）';
  var homework=document.getElementById('homeworkStatus').value||'（未選択）';
  var testCov=document.getElementById('testCoverage').value||'（未選択）';
  var policyChecked=[];
  document.querySelectorAll('.policy-checks input:checked').forEach(function(cb){policyChecked.push(cb.value);});
  var policyLine=policyChecked.length>0?policyChecked.join('・'):'（未選択）';
  var subj=document.getElementById('subjectSelect').value||'（未選択）';
  var comment=document.getElementById('commentBox').value||'なし';
  var wrap=document.getElementById('unitPanelsWrap');
  var lines=[];
  function collectUnitLines(container){
    var result=[];
    container.querySelectorAll('tbody tr').forEach(function(tr){
      var name=tr.cells[0].textContent.trim();
      var nashi=tr.querySelector('.shidou-btn.on-nashi');
      var ari=tr.querySelector('.shidou-btn.on-ari');
      var subBtn=tr.querySelector('.sub-btn.on');
      if(nashi||ari){
        var shidou=nashi?'①指導なし':'②指導あり';
        var sub=subBtn?subBtn.dataset.val:'（未選択）';
        result.push('  ・'+name+'｜'+shidou+'｜'+sub);
      }
    });
    return result;
  }
  var labelMap={j1:'【中1の内容】',j2:'【中2の内容】',j3:'【中3の内容】',e1:'【中1の内容】',e2:'【中2の内容】',e3:'【中3の内容】',h1a:'【数と式】',h1b:'【集合と論理】',h1c:'【２次関数】',h1d:'【三角比】',h1e:'【データの分析】',ha1:'【場合の数と確率】',ha2:'【整数の性質】',ha3:'【図形の性質】',h2a:'【式と証明】',h2b:'【複素数と方程式】',h2c:'【図形と方程式】',h2d:'【三角関数】',h2e:'【指数・対数関数】',h2f:'【微分・積分】',hb1:'【数列】',hb2:'【平面ベクトル】',hb3:'【空間ベクトル】',h3:'【数学Ⅲ】',hc:'【数学C】'};
  wrap.querySelectorAll('div[id^="panel_"]').forEach(function(panel){
    var tag=panel.id.replace('panel_','');
    var panelLines=collectUnitLines(panel);
    if(panelLines.length>0){
      if(labelMap[tag])lines.push(labelMap[tag]);
      panelLines.forEach(function(l){lines.push(l);});
    }
  });
  var nonMath=wrap.querySelector('div:not([id])');
  if(nonMath){collectUnitLines(nonMath).forEach(function(l){lines.push(l);});}
  var engChecked=[];
  document.querySelectorAll('#engIssueChecks input[type=checkbox]:checked').forEach(function(cb){engChecked.push(cb.value);});
  var engLine=engChecked.length>0?'\n【英語の課題】\n'+engChecked.map(function(e){return'  ・'+e;}).join('\n'):'';
  var mathChecked=[];
  document.querySelectorAll('#mathIssueChecks input[type=checkbox]:checked').forEach(function(cb){mathChecked.push(cb.value);});
  var mathLine=mathChecked.length>0?'\n【数学の課題】\n'+mathChecked.map(function(e){return'  ・'+e;}).join('\n'):'';
  var text='■ 授業報告\n─────────────────────\n授業日：'+date+'　担当：'+teacher+'\n学年：'+grade+'　生徒：'+student+'\n科目：'+subj+'\n授業方針：'+policyLine+'\n集中度：'+focus+'\n宿題の実施状況：'+homework+'\nテスト範囲カバー率：'+testCov+'\n─────────────────────\n【単元別記録】（記録した単元のみ）\n'+(lines.length>0?lines.join('\n'):'（記録なし）')+engLine+mathLine+'\n─────────────────────\n【コメント】\n'+comment;
  document.getElementById('previewContent').textContent=text;
  var box=document.getElementById('previewBox');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function generateNotion(){
  var text=document.getElementById('previewContent').textContent;
  var prompt=text+'\n\nこの授業報告を、保護者がNotionで閲覧するための記録用文に変換してください。以下の書式で作成してください。\n\n▶ [授業日]　[科目]　担当：[講師名]\n\n【授業方針】\n[授業方針]\n\n【集中度】\n[集中度]\n\n【宿題の実施状況】\n[宿題の実施状況]\n\n【テスト範囲カバー率】\n[テスト範囲カバー率]\n\n【今日学んだこと】\n[単元名を箇条書き]\n\n【理解の状況】\n[単元名と理解度・正答率を分かりやすく]\n\n【これから意識してほしいこと】\n[課題項目を前向きな表現で]\n\n【先生からのメッセージ】\n[保護者向けの丁寧で温かいメッセージ。専門用語を避けて分かりやすく。]';
  window._notionPrompt=prompt;
  if(window.sendPrompt){
    sendPrompt(prompt);
  } else {
    if(navigator.clipboard){
      navigator.clipboard.writeText(prompt).then(function(){alert('プロンプトをコピーしました！Claudeのチャット欄に貼り付けてください。');});
    }
  }
}

var today=new Date();
document.getElementById('lessonDate').value=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
</script>
