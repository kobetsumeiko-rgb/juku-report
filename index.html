<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業報告フォーム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f4f0}
.wrap{max-width:780px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:20px;font-weight:500;margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid #ddd}
.section{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.section-title{font-size:13px;font-weight:500;color:#666;margin-bottom:.75rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:#666;margin-bottom:4px}
select,input[type=text],input[type=date]{width:100%;height:36px;padding:0 10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 2px rgba(127,119,221,.15)}
.grade-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.grade-tab{padding:6px 16px;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;background:#fff;color:#666;font-family:inherit}
.grade-tab:hover{background:#f5f5f5}
.grade-tab.active-j1{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC;font-weight:500}
.grade-tab.active-j2{background:#E1F5EE;color:#085041;border-color:#5DCAA5;font-weight:500}
.grade-tab.active-j3{background:#FAECE7;color:#712B13;border-color:#F0997B;font-weight:500}
.unit-table{width:100%;border-collapse:collapse;margin-top:.5rem}
.unit-table th{font-size:12px;font-weight:500;color:#666;padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
.unit-table td{padding:6px 8px;border-bottom:1px solid #eee;font-size:13px;vertical-align:middle}
.unit-table tr:last-child td{border-bottom:none}
.unit-table tr:hover td{background:#fafafa}
.radio-group{display:flex;gap:6px}
.radio-group label{margin:0;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;color:#1a1a1a;white-space:nowrap}
.radio-group input[type=radio]{width:14px;height:14px;margin:0;accent-color:#7F77DD}
.badge-maru{background:#EAF3DE;color:#27500A;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.badge-circle{background:#E6F1FB;color:#0C447C;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.badge-tri{background:#FAEEDA;color:#633806;border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap}
.accuracy-group{display:flex;gap:4px}
.acc-btn{font-size:11px;padding:3px 7px;border:1px solid #ccc;border-radius:4px;cursor:pointer;background:#fff;color:#666;font-family:inherit}
.acc-btn:hover{background:#f5f5f5}
.acc-btn.sel-low{background:#FCEBEB !important;color:#791F1F !important;border-color:#F09595 !important}
.acc-btn.sel-mid{background:#FAEEDA !important;color:#633806 !important;border-color:#FAC775 !important}
.acc-btn.sel-high{background:#EAF3DE !important;color:#27500A !important;border-color:#C0DD97 !important}
.saved-badge{font-size:11px;background:#E1F5EE;color:#085041;border-radius:4px;padding:1px 7px;margin-left:6px}
.empty-msg{text-align:center;padding:2rem;color:#999;font-size:13px}
.submit-btn{display:block;width:100%;padding:12px;background:#534AB7;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-top:1.5rem;font-family:inherit}
.submit-btn:hover{background:#7F77DD}
.submit-btn:active{transform:scale(.98)}
.preview-box{background:#f5f4f0;border:1px solid #e0e0e0;border-radius:12px;padding:1rem 1.25rem;margin-top:1rem;display:none}
.preview-box pre{font-family:'Courier New',monospace;font-size:12px;color:#1a1a1a;white-space:pre-wrap;word-break:break-all}
.unit-count{font-size:12px;color:#666;background:#f5f4f0;border-radius:4px;padding:2px 8px}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:.75rem}
.hint{font-size:11px;color:#666;margin-bottom:.75rem;line-height:1.7}
.copy-btn{margin-top:1rem;padding:8px 16px;background:#f5f4f0;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;color:#1a1a1a;font-family:inherit}
.copy-btn:hover{background:#eee}
@media(max-width:500px){.row{grid-template-columns:1fr}.accuracy-group{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<h1>授業報告フォーム</h1>

<div class="section">
  <div class="section-title">基本情報</div>
  <div class="row">
    <div><label>授業日</label><input type="date" id="lessonDate"></div>
    <div><label>担当講師</label><input type="text" id="teacherName" placeholder="講師名を入力"></div>
  </div>
  <div class="row">
    <div>
      <label>学年</label>
      <select id="gradeSelect" onchange="onGradeChange()">
        <option value="">-- 学年を選択 --</option>
        <option value="小3">小学3年生</option><option value="小4">小学4年生</option>
        <option value="小5">小学5年生</option><option value="小6">小学6年生</option>
        <option value="中1">中学1年生</option><option value="中2">中学2年生</option>
        <option value="中3">中学3年生</option>
        <option value="高1">高校1年生</option><option value="高2">高校2年生</option><option value="高3">高校3年生</option>
      </select>
    </div>
    <div>
      <label>生徒名</label>
      <select id="studentSelect"><option value="">-- 先に学年を選択 --</option></select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>授業への集中度</label>
      <select id="focusSelect">
        <option value="">-- 選択してください --</option>
        <option value="非常によく集中できた">◎ 非常によく集中できた</option>
        <option value="集中できていた">○ 集中できていた</option>
        <option value="やや集中できていなかった">△ やや集中できていなかった</option>
        <option value="集中できていなかった">▲ 集中できていなかった</option>
        <option value="眠そうにしていた">眠そうにしていた</option>
        <option value="2回以上席を離れた">2回以上席を離れた</option>
        <option value="授業中ずっと落ち着かなかった">授業中ずっと落ち着かなかった</option>
      </select>
    </div>
    <div>
      <label>科目</label>
      <select id="subjectSelect" onchange="onSubjectChange()">
        <option value="">-- 先に学年を選択 --</option>
      </select>
    </div>
  </div>
</div>

<div class="section" id="unitSection" style="display:none">
  <div class="section-header">
    <div class="section-title" style="margin:0">単元・理解度の記録</div>
    <span class="unit-count" id="unitCount"></span>
  </div>
  <div class="hint">
    理解度：◎自力で解ける ／ ○教わってできるようになった ／ ▲まだできているとは言えない<br>
    正答率：<span style="background:#FCEBEB;color:#791F1F;padding:1px 5px;border-radius:3px">50%未満</span>
    <span style="background:#FAEEDA;color:#633806;padding:1px 5px;border-radius:3px;margin:0 3px">50〜75%</span>
    <span style="background:#EAF3DE;color:#27500A;padding:1px 5px;border-radius:3px">75%以上</span>
  </div>
  <div id="mathGradeTabs" style="display:none">
    <div style="font-size:12px;color:#666;margin-bottom:6px">実施単元の学年を選択（タブを切り替えても入力内容は保持されます）</div>
    <div class="grade-tabs" id="gradeTabsInner"></div>
  </div>
  <div id="unitPanelsWrap"></div>
</div>

<div class="section">
  <div class="section-title">コメント・メモ</div>
  <textarea id="commentBox" rows="4" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;resize:vertical" placeholder="保護者様への連絡事項、次回の課題など"></textarea>
</div>

<button class="submit-btn" onclick="submitReport()">授業報告をプレビューする</button>

<div class="preview-box" id="previewBox">
  <div style="font-size:13px;font-weight:500;margin-bottom:.5rem;color:#666">報告内容プレビュー</div>
  <pre id="previewContent"></pre>
  <button class="copy-btn" onclick="copyReport()">テキストをコピーする</button>
</div>
</div>

var currentTag=null;

function onGradeChange(){
  var g=document.getElementById('gradeSelect').value;
  var ss=document.getElementById('studentSelect');
  var subj=document.getElementById('subjectSelect');
  ss.innerHTML='<option value="">-- 生徒を選択 --</option>';
  subj.innerHTML='<option value="">-- 科目を選択 --</option>';
  document.getElementById('unitSection').style.display='none';
  currentTag=null;
  if(!g)return;
  (STUDENTS[g]||[]).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o);});
  (SUBJECTS[g]||[]).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;subj.appendChild(o);});
}

function getSubjectKey(grade,subj){
  if(subj==="算数"){if(grade==="小4")return"算数（小4）";if(grade==="小5")return"算数（小5）";if(grade==="小6")return"算数（小6）";}
  if(subj==="国語")return grade.indexOf("高")===0?"国語（高）":"国語（中）";
  if(subj==="英語")return grade.indexOf("高")===0?"英語（高）":"英語（中）";
  if(subj==="理科")return"理科（中）";
  if(subj==="社会")return"社会（中）";
  return subj;
}

function onSubjectChange(){
  var g=document.getElementById('gradeSelect').value;
  var s=document.getElementById('subjectSelect').value;
  var sec=document.getElementById('unitSection');
  var tabsArea=document.getElementById('mathGradeTabs');
  var wrap=document.getElementById('unitPanelsWrap');
  if(!g||!s){sec.style.display='none';return;}
  sec.style.display='block';
  currentTag=null;
  wrap.innerHTML='';
  tabsArea.style.display='none';
  if(s==="数学"&&MATH_BY_GRADE[g]){
    tabsArea.style.display='block';
    buildMathPanels(g);
    document.getElementById('unitCount').textContent='学年タブを選択してください';
  } else {
    var key=getSubjectKey(g,s);
    var units=GENERIC_UNITS[key];
    if(units){var panel=buildUnitPanel(units,null);panel.style.display='block';wrap.appendChild(panel);}
    else{wrap.innerHTML='<div class="empty-msg">この科目の単元は随時追加されます</div>';}
    updateUnitCount();
  }
}

function buildMathPanels(studentGrade){
  var inner=document.getElementById('gradeTabsInner');
  var wrap=document.getElementById('unitPanelsWrap');
  inner.innerHTML='';
  wrap.innerHTML='';
  var groups=MATH_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.createElement('button');
    btn.className='grade-tab';
    btn.id='tab_'+g.tag;
    btn.textContent=g.label+'の内容';
    var panel=buildUnitPanel(g.units,g.tag);
    panel.id='panel_'+g.tag;
    wrap.appendChild(panel);
    (function(tag){
      btn.addEventListener('click',function(){switchMathTab(studentGrade,tag);});
    })(g.tag);
    inner.appendChild(btn);
  });
}

function switchMathTab(studentGrade,tag){
  var groups=MATH_BY_GRADE[studentGrade]||[];
  groups.forEach(function(g){
    var btn=document.getElementById('tab_'+g.tag);
    if(!btn)return;
    btn.style.opacity='1';
    if(g.tag===tag){btn.className='grade-tab active-'+tag;}
    else{btn.className='grade-tab';btn.style.opacity='0.45';}
    var panel=document.getElementById('panel_'+g.tag);
    if(panel)panel.style.display=(g.tag===tag)?'block':'none';
  });
  currentTag=tag;
  updateUnitCount();
}

function buildUnitPanel(units,tag){
  var panel=document.createElement('div');
  panel.style.display='none';
  var tbl=document.createElement('table');
  tbl.className='unit-table';
  tbl.innerHTML='<thead><tr><th style="width:36%">単元名</th><th style="width:36%">理解度</th><th>正答率</th></tr></thead>';
  var tb=document.createElement('tbody');
  units.forEach(function(u,i){
    var uid='u_'+(tag||'g')+'_'+i;
    var tr=document.createElement('tr');
    var tdName=document.createElement('td');
    tdName.style.fontSize='13px';
    tdName.textContent=u;
    var tdUnd=document.createElement('td');
    var rg=document.createElement('div');
    rg.className='radio-group';
    [['◎','badge-maru'],['○','badge-circle'],['▲','badge-tri']].forEach(function(pair){
      var lbl=document.createElement('label');
      var inp=document.createElement('input');
      inp.type='radio';inp.name=uid+'_und';inp.value=pair[0];
      var badge=document.createElement('span');
      badge.className=pair[1];badge.textContent=pair[0];
      lbl.appendChild(inp);lbl.appendChild(badge);rg.appendChild(lbl);
      inp.addEventListener('change',function(){updateTabBadge(tag);});
    });
    tdUnd.appendChild(rg);
    var tdAcc=document.createElement('td');
    var ag=document.createElement('div');
    ag.className='accuracy-group';
    [['50%未満','low'],['50〜75%','mid'],['75%以上','high']].forEach(function(pair){
      var btn=document.createElement('button');
      btn.className='acc-btn';btn.textContent=pair[0];
      (function(b,level){
        b.addEventListener('click',function(){
          ag.querySelectorAll('.acc-btn').forEach(function(x){x.className='acc-btn';});
          b.classList.add('sel-'+level);
          updateTabBadge(tag);
        });
      })(btn,pair[1]);
      ag.appendChild(btn);
    });
    tdAcc.appendChild(ag);
    tr.appendChild(tdName);tr.appendChild(tdUnd);tr.appendChild(tdAcc);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);panel.appendChild(tbl);
  return panel;
}

function updateTabBadge(tag){
  if(!tag)return;
  var panel=document.getElementById('panel_'+tag);
  var btn=document.getElementById('tab_'+tag);
  if(!panel||!btn)return;
  var count=0;
  panel.querySelectorAll('tbody tr').forEach(function(tr){
    if(tr.querySelector('input[type=radio]:checked')||tr.querySelector('.acc-btn.sel-low,.acc-btn.sel-mid,.acc-btn.sel-high'))count++;
  });
  var existing=btn.querySelector('.saved-badge');
  if(existing)existing.remove();
  if(count>0){var badge=document.createElement('span');badge.className='saved-badge';badge.textContent=count+'件入力済';btn.appendChild(badge);}
}

function updateUnitCount(){
  var wrap=document.getElementById('unitPanelsWrap');
  var visible=null;
  wrap.querySelectorAll('div').forEach(function(d){if(d.style.display==='block')visible=d;});
  if(visible){document.getElementById('unitCount').textContent=visible.querySelectorAll('tbody tr').length+'単元';}
}

function submitReport(){
  var date=document.getElementById('lessonDate').value||'（未入力）';
  var teacher=document.getElementById('teacherName').value||'（未入力）';
  var grade=document.getElementById('gradeSelect').value||'（未選択）';
  var student=document.getElementById('studentSelect').value||'（未選択）';
  var focus=document.getElementById('focusSelect').value||'（未選択）';
  var subj=document.getElementById('subjectSelect').value||'（未選択）';
  var comment=document.getElementById('commentBox').value||'なし';
  var wrap=document.getElementById('unitPanelsWrap');
  var lines=[];
  wrap.querySelectorAll('div[id^="panel_"]').forEach(function(panel){
    var tag=panel.id.replace('panel_','');
    var panelLines=[];
    panel.querySelectorAll('tbody tr').forEach(function(tr){
      var name=tr.cells[0].textContent.trim();
      var checked=tr.querySelector('input[type=radio]:checked');
      var accSel=tr.querySelector('.acc-btn.sel-low,.acc-btn.sel-mid,.acc-btn.sel-high');
      if(checked||accSel){
        var und=checked?checked.value:'（未記入）';
        var acc=accSel?accSel.textContent.trim():'（未記入）';
        panelLines.push('  ・'+name+'｜理解度：'+und+'｜正答率：'+acc);
      }
    });
    if(panelLines.length>0){
      var labelMap={j1:'【中1の内容】',j2:'【中2の内容】',j3:'【中3の内容】'};
      if(labelMap[tag])lines.push(labelMap[tag]);
      panelLines.forEach(function(l){lines.push(l);});
    }
  });
  // 非数学科目（panel_なしのdiv）
  var nonMath=wrap.querySelector('div:not([id])');
  if(nonMath){
    nonMath.querySelectorAll('tbody tr').forEach(function(tr){
      var name=tr.cells[0].textContent.trim();
      var checked=tr.querySelector('input[type=radio]:checked');
      var accSel=tr.querySelector('.acc-btn.sel-low,.acc-btn.sel-mid,.acc-btn.sel-high');
      if(checked||accSel){
        var und=checked?checked.value:'（未記入）';
        var acc=accSel?accSel.textContent.trim():'（未記入）';
        lines.push('  ・'+name+'｜理解度：'+und+'｜正答率：'+acc);
      }
    });
  }
  var text='■ 授業報告\n─────────────────────\n授業日：'+date+'　担当：'+teacher+'\n学年：'+grade+'　生徒：'+student+'\n科目：'+subj+'\n集中度：'+focus+'\n─────────────────────\n【単元別記録】（記録した単元のみ）\n'+(lines.length>0?lines.join('\n'):'（記録なし）')+'\n─────────────────────\n【コメント】\n'+comment;
  document.getElementById('previewContent').textContent=text;
  var box=document.getElementById('previewBox');
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyReport(){
  var text=document.getElementById('previewContent').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){alert('コピーしました！');});
  } else {
    var ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    alert('コピーしました！');
  }
}

var today=new Date();
document.getElementById('lessonDate').value=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
</script>
